      ${sel("mesBase", "base", "Mês do orçamento (base)")}${sel("mesAtual", "atual", "Mês atual (T−1)")}
      <div class="field"><label>Fator de correção</label><div class="fator" id="fator">${fat(R.fator)}</div></div>
      ${!meses.length ? `<div class="field full" style="color:var(--muted);font-size:14px">A tabela de INCC está vazia. Cadastre os índices em INCC, no menu superior, ou informe os valores manualmente.</div>` : ""}

      <p style="margin:0;color:var(--muted);font-size:14px">Esta QQP guarda a própria cópia do modelo. Mudanças feitas depois no cadastro de modelos não a alteram.</p>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">

      </div>
    </div>
    <div class="form-grid"><div class="field full"><label for="dObs">Observações</label><textarea id="dObs" data-bind="observacoes" placeholder="Premissas, escopo, o que está incluso no preço…">${esc(q.observacoes)}</textarea></div></div>
  </div>`;
}

/* ---------------- render ---------------- */
// a 2ª linha do cabeçalho fixo fica logo abaixo da 1ª, qualquer que seja a altura dela
function ajustarCabecalhos(){
  document.querySelectorAll("table.qqp thead").forEach(th => { if (th.rows.length < 2) return; const h = th.rows[0].getBoundingClientRect().height; for (const c of th.rows[1].cells) c.style.top = h + "px"; });
}
function guardarScroll(){ const sc = {}; document.querySelectorAll(".scroller[id]").forEach(e => sc[e.id] = [e.scrollLeft, e.scrollTop]); return sc; }
function restaurarScroll(sc){ Object.entries(sc).forEach(([id, [l, t]]) => { const e = document.getElementById(id); if (e){ e.scrollLeft = l; e.scrollTop = t; } }); }
function render(){
  const sc = guardarScroll(), y = window.scrollY;
  if (!S.user || S.view === "login") return telaLogin();
  if (S.view === "carregando") app.innerHTML = `<div class="carregando">Carregando…</div>`;
  else if (S.view === "erro") app.innerHTML = topo() + `<main><div class="wrap"><div class="banner">Não foi possível carregar os dados: ${esc(S.erro)}. Confira se as regras do Firestore foram publicadas com as coleções obras, modelos, config e qqps.</div></div></main>`;
  else if (S.view === "obras") app.innerHTML = telaObras();
  else if (S.view === "obra") app.innerHTML = telaObra();
  else if (S.view === "modelos") app.innerHTML = telaModelos();
  else if (S.view === "modelo") app.innerHTML = telaModelo();
  else if (S.view === "incc") app.innerHTML = telaIncc();
  else if (S.view === "qqp"){ app.innerHTML = telaQQP(); atualizarStatus(); }
  restaurarScroll(sc); window.scrollTo(0, y); ajustarCabecalhos(); posRender();
}
function posRender(){
  hidratarImagens();
  if (!travada()) return;
  const main = document.getElementById("main"); if (!main) return;
  main.classList.add("travada");
  main.querySelectorAll("input, select, textarea").forEach(el => { if (!el.dataset.filtro) el.disabled = true; });
  main.querySelectorAll("button[data-act]").forEach(b => { if (!ACOES_LIVRES.has(b.dataset.act)) b.style.display = "none"; });
}
function renderAba(){
  if (S.view !== "qqp") return render();
  const sc = guardarScroll(); const aberto = document.getElementById("filtroF")?.open;
  const main = document.getElementById("main"); if (!main) return render();
  main.innerHTML = conteudoAba(); restaurarScroll(sc); ajustarCabecalhos(); posRender();
  if (aberto){ const d = document.getElementById("filtroF"); if (d) d.open = true; }
}
function atualizarCalculos(){
  const R = calc(S.q);
  document.querySelectorAll("[data-qtdi]").forEach(e => { const I = R.itens[e.dataset.qtdi]; const it = todosItens(S.q).find(x => x.id === e.dataset.qtdi); if (I && !it?.global) e.innerHTML = celQtdItem(I); });
  document.querySelectorAll("[data-qtdg]").forEach(e => { const G = R.grupos[e.dataset.qtdg]; if (G) e.textContent = qtdF(G.qtd); });
  document.querySelectorAll("[data-qtdn]").forEach(e => { const P = R.n2[e.dataset.qtdn]; if (P) e.textContent = qtdF(P.qtd); });
  document.querySelectorAll("[data-pu]").forEach(e => { const o = S.q.ofertas[+e.dataset.pu]; if (o){ const ins = R.insumos.get(o.insumoId); e.innerHTML = brl(precoUn(o)) + (num(o.contem) > 1 ? `<small>${qtdF(Math.ceil((ins?.qtd || 0) / num(o.contem) - 1e-9))} ${esc(o.unidVenda || "unid.")} p/ pedido</small>` : ""); } });
  document.querySelectorAll("[data-herd]").forEach(e => { const [pid, k] = e.dataset.herd.split("|"); const p = S.q.grupos.flatMap(g => g.n2).find(x => x.id === pid); if (p) e.textContent = qtdF(num(p.valores[k])); });
  document.querySelectorAll("[data-herdph]").forEach(e => { const [pid, k] = e.dataset.herdph.split("|"); const p = S.q.grupos.flatMap(g => g.n2).find(x => x.id === pid); const v = p?.valores[k]; e.placeholder = v != null && v !== "" ? inVal(v) : ""; });
  if (S.q.modelo.especial === "portas") document.querySelectorAll("[data-batchk]").forEach(e => {
    const it = todosItens(S.q).find(x => x.id === e.dataset.batchk); if (!it) return;
    const c = checarBatente(S.q.modelo, it); e.innerHTML = htmlBatente(c, it.id);

function chaveUnica(base, campos, self){
  let k = base || "campo", n = 2;
  while (campos.some(c => c !== self && c.chave === k)) k = `${base}_${n++}`;
  return k;
}
function atualizarChips(){
  const m = S.modeloEdit; const box = document.getElementById("mChips"); if (box) box.innerHTML = chipsCampos(m);
  const pv = document.getElementById("mPreviaCampos"); if (pv) pv.innerHTML = previaCampos(m);
}
function atualizarFormula(){
  const m = S.modeloEdit; const box = document.getElementById("mFormulaMsg"); if (!box) return;
  let erro = null, res = null;
  try { const ast = compilar(m.formula, chavesDe(m)); res = avaliar(ast, previaValores(m)); } catch (ex){ erro = ex.message; }
  box.innerHTML = erro ? `<div class="formula-erro">${esc(erro)}</div>` : `<div class="formula-ok">Fórmula válida</div><div class="legivel">Total = ${esc(formulaLegivel(m))}</div>`;
  const p = document.getElementById("mPrev"); if (p) p.textContent = "= " + (erro ? "—" : qtdF(res));
}
const proximaRev = r => { const mm = /^(\D*)(\d+)$/.exec(r || ""); return mm ? mm[1] + String(+mm[2] + 1).padStart(mm[2].length, "0") : (r || "R00"); };

async function executar(a, d, e){
  const q = S.q; const gi = +d.g, pi = +d.p, ii = +d.i;
  if (travada() && !ACOES_LIVRES.has(a)) return toast("QQP finalizada: reabra para editar.");
  const mudou = () => { marcarAlterado(); renderAba(); };
  try {
  switch (a){
    /* navegação */
    case "irObras": if (S.view === "obras") return; await irPara("obras"); break;
    case "irModelos": await irPara("modelos"); break;
    case "irIncc": await irPara("incc"); break;
    case "sair": if (!podeSair()) return; fecharQQP(); await signOut(auth); break;
    case "abrirObra": abrirObra(d.id); break;
    case "voltarObra": await sairDaQQP("obra"); break;
    case "obraTab": if (S.obraTab === "estrutura" && S.obraDirty && !confirm("A estrutura tem alterações não salvas. Trocar de aba mesmo assim?")) return;
      if (S.obraTab === "estrutura" && S.obraDirty){ const o = obraAtual(); S.obraEdit = clone(o.estrutura || { grupos: [] }); S.obraEdit.grupos ??= []; S.obraDirty = false; }
      S.obraTab = d.tab; render(); break;

    /* obras */
    case "novaObra": modalNovaObra(); break;
    case "salvarDadosObra": {
      const o = obraAtual(); const nome = document.getElementById("oNome").value.trim(); if (!nome) return alert("Informe o nome da obra.");
      Object.assign(o, { nome, codigo: document.getElementById("oCod").value.trim(), cidade: document.getElementById("oCid").value.trim() });
      const { id, ...r } = o; await setDoc(doc(db, C_OBRA, o.id), r); toast("Dados da obra salvos."); render(); break; }
    case "excluirObra": {
      if (S.qqps.length) return alert("Esta obra tem QQPs. Exclua as QQPs antes de excluir a obra.");
      const o = obraAtual(); if (!confirm(`Excluir a obra "${o.nome}"?`)) return;
      await deleteDoc(doc(db, C_OBRA, o.id)); S.obras = S.obras.filter(x => x.id !== o.id); S.view = "obras"; render(); toast("Obra excluída."); break; }
    case "oAddG": S.obraEdit.grupos.push({ id: uid(), nome: "", n2: [] }); S.obraDirty = true; render(); break;
    case "oAddN2": { const g = S.obraEdit.grupos[gi]; const ant = g.n2[g.n2.length - 1]; g.n2.push({ id: uid(), nome: "", valores: clone(ant?.valores || {}) }); S.obraDirty = true; render(); break; }
    case "oMov": if (isNaN(pi)) moveArr(S.obraEdit.grupos, gi, +d.d); else moveArr(S.obraEdit.grupos[gi].n2, pi, +d.d); S.obraDirty = true; render(); break;
    case "oDel": if (isNaN(pi)){ if (!confirm("Excluir o agrupador e seus pavimentos?")) return; S.obraEdit.grupos.splice(gi, 1); } else S.obraEdit.grupos[gi].n2.splice(pi, 1); S.obraDirty = true; render(); break;
    case "salvarEstrutura": {
      const o = obraAtual(); o.estrutura = clone(S.obraEdit); const { id, ...r } = o;
      await setDoc(doc(db, C_OBRA, o.id), r); S.obraDirty = false; render(); toast("Estrutura da obra salva."); break; }

    /* QQPs na obra */
    case "novaQQP": modalNovaQQP(); break;
    case "abrirQQP": abrirQQP(d.id); break;
    case "duplicarQQP": e?.stopPropagation(); modalNovaQQP(d.id); break;
    case "excluirQQP": {
      e?.stopPropagation(); const x = S.qqps.find(z => z.id === d.id);
      if (!confirm(`Excluir a QQP "${x.pacote} ${x.revisao}"? Essa ação não pode ser desfeita.`)) return;
      await deleteDoc(doc(db, C_QQP, d.id)); S.qqps = S.qqps.filter(z => z.id !== d.id); render(); toast("QQP excluída."); break; }

    /* modelos */
    case "novoModelo": S.modeloEdit = { id: uid(), _novo: true, nome: "", unidade: "un", usaNivel2: true, nivel2Nome: "Pavimento", valorGlobal: false, campos: [], descritivas: [], formula: "" };

    case "duplicarModelo": { e?.stopPropagation(); const m = clone(modeloPorId(d.id)); m.id = uid(); m._novo = true; m.nome = m.nome + " (cópia)"; S.modeloEdit = m; S.previa = {}; await irPara("modelo"); S.modeloDirty = true; break; }
    case "mAddCampo": { const c = { id: uid(), chave: "", nome: "", nivel: "item", unidade: "", _novo: true }; c.chave = chaveUnica("coluna", S.modeloEdit.campos, c); S.modeloEdit.campos.push(c); S.modeloDirty = true; render(); document.querySelectorAll('[data-mbind$=".nome"][data-mbind^="campos."]').forEach((el, i, all) => { if (i === all.length - 1) el.focus(); }); break; }
    case "mDelCampo": { const c = S.modeloEdit.campos[ii]; if (chaveTravada(S.modeloEdit, c)) return; if (new RegExp(`\\b${c.chave}\\b`).test(S.modeloEdit.formula) && !confirm(`A coluna "${c.nome}" está na fórmula. Excluir mesmo assim?`)) return; S.modeloEdit.campos.splice(ii, 1); S.modeloDirty = true; render(); break; }
    case "mAddDesc": S.modeloEdit.descritivas.push({ id: uid(), nome: "" }); S.modeloDirty = true; render(); break;
    case "mAddBat": (S.modeloEdit.batentes ??= []).push(""); S.modeloDirty = true; render(); { const els = document.querySelectorAll('[data-mbind^="batentes."]'); els[els.length - 1]?.focus(); } break;

      if (!/\barea_unit\b/.test(m.formula)) m.formula = (m.campos.some(c => c.chave === "repeticoes") ? "repeticoes * " : "") + "area_unit";
      S.modeloDirty = true; render(); toast("Colunas do granito restauradas. Confira a fórmula e salve o modelo."); break; }
    case "pers": modalPers(d.id); break;
    case "mLimpar": S.modeloEdit.formula = ""; S.caret = 0; S.modeloDirty = true; render(); break;
    case "salvarModelo": {

      if (m.campos.some(c => !c.nome.trim())) return alert("Todas as colunas de quantidade precisam de nome.");
      try { compilar(m.formula, chavesDe(m)); } catch (ex){ return alert("A fórmula tem um problema: " + ex.message); }
      if (ehGranito(m) && (m.tiposBancada || []).some(t => !String(t.nome || "").trim())) return alert("Todos os tipos de bancada precisam de nome.");
      if (S.modelos.some(x => x.id !== m.id && chave(x.nome) === chave(m.nome))) return alert("Já existe um modelo com esse nome.");
      if (m.especial === "portas"){ m.batentes = (m.batentes || []).map(x => String(x).trim()).filter(Boolean); const ruim = m.batentes.find(x => !parseBatente(x)); if (ruim) return alert(`O batente "${ruim}" não está no formato largura+regulagem (ex.: 12+5).`); }
      const limpo = clone(m); delete limpo._novo; limpo.campos.forEach(c => delete c._novo);
      const anterior = modeloPorId(m.id); const renN2 = {};

        }

    case "excluirModelo": { const m = S.modeloEdit; if (!confirm(`Excluir o modelo "${m.nome}"? As QQPs já criadas com ele não são afetadas.`)) return;
      await deleteDoc(doc(db, C_MOD, m.id)); S.modelos = S.modelos.filter(x => x.id !== m.id); S.modeloDirty = false; S.view = "modelos"; render(); toast("Modelo excluído."); break; }

    case "expandir": S.fechados.clear(); renderAba(); break;
    case "recolher": q.grupos.forEach(g => g.n2.forEach(p => S.fechados.add(p.id))); renderAba(); break;

    case "decMenor": {

    case "decLimpar": if (!confirm("Limpar todas as escolhas da decisão de compra?")) return; q.decisao = {}; mudou(); break;
    case "filtroTodos": S.ocultos.clear(); renderAba(); break;
    case "addGrupo": q.grupos.push({ id: uid(), nome: "", orcamento: null, n2: [{ id: uid(), nome: "", valores: {}, itens: [] }] }); mudou(); focarUltimo('[data-bind^="grupos."][data-bind$=".nome"]:not([data-bind*=".n2."])'); break;
    case "addN2": { const g = q.grupos[gi]; const ant = g.n2[g.n2.length - 1];
      g.n2.push({ id: uid(), nome: "", valores: clone(ant?.valores || {}), itens: [] }); S.fechados.delete(g.id); mudou();

      focarUltimo(`[data-insumo^="${gi}.${pi}."]`); break; }

    case "del": {
      if (d.nivel === "g"){ const g = q.grupos[gi]; const n = g.n2.reduce((s, p) => s + p.itens.length, 0); if (n && !confirm(`Excluir o agrupador "${g.nome || "sem nome"}" com ${n} insumo(s)?`)) return; q.grupos.splice(gi, 1); }
      if (d.nivel === "p"){ const p = q.grupos[gi].n2[pi]; if (p.itens.length && !confirm(`Excluir "${p.nome || "sem nome"}" e seus ${p.itens.length} insumo(s)?`)) return; q.grupos[gi].n2.splice(pi, 1); if (!q.grupos[gi].n2.length) q.grupos[gi].n2.push({ id: uid(), nome: "", valores: {}, itens: [] }); }
      if (d.nivel === "i") q.grupos[gi].n2[pi].itens.splice(ii, 1);

    case "delF": { const f = q.fornecedores[+d.f];

      for (const k of Object.keys(q.decisao)) if (q.decisao[k] === f.id) delete q.decisao[k];
      todosItens(q).forEach(i => delete i.escolhas[f.id]); S.ocultos.delete(f.id); mudou(); break; }
    case "movF": moveArr(q.fornecedores, +d.f, +d.d); mudou(); break;
    case "addAj": q.fornecedores[+d.f].ajustes.outros.push({ desc: "", valor: null }); mudou(); break;

    case "delIns": delete q.decisao[q.insumos[+d.k]?.id]; q.insumos.splice(+d.k, 1); q.ofertas = q.ofertas.filter(o => q.insumos.some(i => i.id === o.insumoId)); mudou(); break;
    case "colarOfertas": modalColarOfertas(); break;
    case "trazerModelo": {
      const m = modeloPorId(q.modeloId) || S.modelos.find(x => chave(x.nome) === chave(q.pacote));
      if (!m) return alert("O modelo desta carteira não existe mais no cadastro.");
      if (!confirm(`Substituir o modelo desta QQP pela versão atual de "${m.nome}"? Os valores digitados são mantidos; colunas que não existirem mais deixam de aparecer.`)) return;
      const { id, ...r } = clone(m);
      const antigas = Object.fromEntries(q.modelo.campos.map(c => [c.id, c.chave])); const ren = {};
      r.campos.forEach(c => { const a = antigas[c.id]; if (a && a !== c.chave) ren[a] = c.chave; });
      const renomear = v => { const o = {}; for (const [k, x] of Object.entries(v || {})) o[ren[k] ?? k] = x; return o; };
      if (Object.keys(ren).length) q.grupos.forEach(g => g.n2.forEach(p => { p.valores = renomear(p.valores); p.itens.forEach(i => i.valores = renomear(i.valores)); }));
      q.modelo = r; q.modeloId = id; normalizarQQP(q); mudou(); toast("Modelo atualizado. Salve a QQP para manter."); break; }
    case "salvarComoEstrutura": {
      const o = obraAtual(); if (o.estrutura?.grupos?.length && !confirm("A obra já tem uma estrutura pré-montada. Substituir pela desta QQP?")) return;

      o.estrutura = { grupos: q.grupos.map(g => ({ id: uid(), nome: g.nome, n2: g.n2.map(p => ({ id: uid(), nome: p.nome, valores: Object.fromEntries(n2Chaves.map(k => [k, p.valores[k] ?? null])) })) })) };
      const { id, ...r } = o; await setDoc(doc(db, C_OBRA, o.id), r); S.obraEdit = clone(o.estrutura); toast("Estrutura salva na obra."); break; }
  }
  } catch (ex){ console.error(ex); alert("Não foi possível concluir: " + ex.message); }
}
function focarUltimo(sel){ const els = document.querySelectorAll(sel); const el = els[els.length - 1]; if (el){ el.focus(); el.scrollIntoView({ block: "nearest" }); } }

function abrirModal(html){
  const bg = document.createElement("div"); bg.className = "modal-bg"; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const porTecla = ev => { if (ev.key === "Escape" && document.body.contains(bg)){ ev.preventDefault(); fechar(); } };
  const fechar = () => { bg.remove(); document.removeEventListener("keydown", porTecla); };
  bg.addEventListener("click", ev => { if (ev.target === bg || ev.target.closest("[data-fechar]")) fechar(); });
  document.addEventListener("keydown", porTecla);
  const md = bg.querySelector(".modal"); md.tabIndex = -1;
  setTimeout(() => (bg.querySelector("input:not([type=file]):not([type=checkbox]),select,textarea") || md).focus(), 30);
  return { bg, fechar };
}

function parseMes(s){
  s = String(s || "").trim().toLowerCase();
  let m = /^(\d{4})-(\d{1,2})/.exec(s); if (m) return `${m[1]}-${m[2].padStart(2, "0")}`;
  m = /^(?:\d{1,2}\/)?(\d{1,2})\/(\d{2,4})$/.exec(s); if (m){ const y = m[2].length === 2 ? "20" + m[2] : m[2]; return `${y}-${m[1].padStart(2, "0")}`; }
  m = /^([a-zç]{3})[a-zç]*[\/\-\s.]*(\d{2,4})$/.exec(s); if (m){ const i = MESES.indexOf(m[1]); if (i >= 0){ const y = m[2].length === 2 ? "20" + m[2] : m[2]; return `${y}-${String(i + 1).padStart(2, "0")}`; } }
  return null;
}

    });
    fechar(); marcarAlterado(); renderAba();
    toast(`${n} preço(s) adicionado(s)${u ? `, ${u} atualizado(s)` : ""}${novosIns ? `, ${novosIns} insumo(s) novo(s) sem uso nos quantitativos` : ""}${ruins ? `, ${ruins} linha(s) ignorada(s)` : ""}.`, 5000);
  };
}

function carregarImg(src){ return new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error("Não foi possível ler a imagem.")); i.src = src; }); }
// reduz para ~1000 px e comprime (WebP, ou JPEG se o navegador não gerar WebP), abaixo do limite do Firestore
async function comprimirImagem(blob){
  const url = URL.createObjectURL(blob);
  try {
    const img = await carregarImg(url);
    let max = 1000, qual = 0.82;
    for (let t = 0; t < 7; t++){
      const esc = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * esc)), h = Math.max(1, Math.round(img.height * esc));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      let data = cv.toDataURL("image/webp", qual);
      if (!data.startsWith("data:image/webp")) data = cv.toDataURL("image/jpeg", qual);
      if (data.length < 520000) return { data, w, h };
      qual = Math.max(0.5, qual - 0.1); max = Math.round(max * 0.85);

/* ---------------- decisão sugerida e pendências ---------------- */
function decisaoMenor(q, F = q.fornecedores){
  const R = calc(q), dec = {};
  for (const ins of R.insumos.values()){
    if (!ins.id) continue;
    let cand = F.filter(f => ins.total[f.id].falta === 0 && ins.total[f.id].total > 0);
    if (!cand.length) cand = F.filter(f => ins.total[f.id].total > 0);
    if (cand.length) dec[ins.id] = cand.reduce((a, b) => ins.total[b.id].total < ins.total[a.id].total ? b : a).id;
  }
  return dec;
}
function pendencias(q, R = calc(q)){
  const P = [], F = q.fornecedores, hoje = hojeISO();
  const em7 = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  const insumos = [...R.insumos.values()].filter(x => x.id);
  const semCot = insumos.filter(x => F.every(f => x.total[f.id].total === 0)).map(x => x.nome);
  if (semCot.length) P.push(`Insumos sem nenhuma cotação: ${semCot.join(", ")}.`);
  const semDec = insumos.filter(x => !R.decisao.ins[x.id]).map(x => x.nome);
  if (semDec.length) P.push(`Insumos sem fornecedor definido na decisão de compra: ${semDec.join(", ")}.`);
  F.forEach(f => {
    const nome = f.nome || "Fornecedor sem nome", fin = R.final[f.id];
    if (fin.falta && fin.base > 0) P.push(`${nome}: proposta parcial, cotou ${R.nItens - fin.falta} de ${R.nItens} itens.`);
    if (f.validade && f.validade < hoje) P.push(`${nome}: proposta vencida em ${dataBR(f.validade)}.`);
    else if (f.validade && f.validade <= em7) P.push(`${nome}: proposta vence em ${dataBR(f.validade)}.`);
    const falt = [!f.cnpj && "CNPJ", !f.condicaoPagamento && "condição de pagamento", !f.prazoEntrega && "prazo de entrega", !f.frete && "frete (CIF/FOB)", !f.validade && "validade da proposta"].filter(Boolean);
    if (falt.length) P.push(`${nome}: falta ${falt.join(", ")}.`);
  });
  if (!R.orc) P.push("Orçamento não informado (agrupador ou insumo).");
  if (R.orc && R.fator === 1) P.push("Correção do orçamento pelo INCC não definida (meses ou índices).");
  if (R.inccFaltando) P.push("Mês de INCC escolhido sem índice na tabela.");
  const cab = [!q.codigoCompra && "código da compra programada", !q.comprador && "comprador"].filter(Boolean);
  if (cab.length) P.push(`Dados da QQP: falta ${cab.join(" e ")}.`);
  return P;
}

      const a = f.ajustes || {};
      const base = [["Prazo de entrega", f.prazoEntrega], ["Condição de pagamento", f.condicaoPagamento], ["Entrada (% no pedido)", num(f.entradaPct) ? `${inVal(num(f.entradaPct))}%` : ""],
        ["Parcelas (dias)", [f.parcelas, f.parcelasBase && `contadas do ${f.parcelasBase}`].filter(Boolean).join(" · ")], ["Frete", [f.frete, num(a.frete) ? brl(num(a.frete)) : ""].filter(Boolean).join(" · ")], ["Validade da proposta", dataBR(f.validade)]];
      if (!completa) return base;
      return [["CNPJ", f.cnpj], ...base, ["Desconto", [num(a.descontoPct) ? `${inVal(num(a.descontoPct))}%` : "", num(a.descontoValor) ? brl(num(a.descontoValor)) : ""].filter(Boolean).join(" + ")],
        ["Outros ajustes", (a.outros || []).filter(x => num(x.valor)).map(x => `${x.desc || "ajuste"}: ${num(x.valor) > 0 ? "+" : "-"}${brl(Math.abs(num(x.valor)))}`).join("; ")],
        ["Contato", f.contato], ["Telefone", f.telefone], ["E-mail", f.email], ["Observações", f.obs]];
    };
    const tabelaFichas = completa => { for (let i = 0; i < Math.max(F.length, 1); i += 5){ const grupo = F.slice(i, i + 5); if (!grupo.length) break;
      const linhas = fichaLinhas(grupo[0], completa).map(([k]) => k);
      tabela({ head: [["", ...grupo.map(f => f.nome || "Sem nome")]], body: linhas.map((k, li) => [{ content: k, styles: { fontStyle: "bold", fillColor: AREIA } }, ...grupo.map(f => fichaLinhas(f, completa)[li][1] || "-")]),
        columnStyles: { 0: { cellWidth: 42 } } }); } };
    secao("Condições comerciais");
    tabelaFichas(false);

    /* ---- pendências ---- */
    const P = final ? (q.pendenciasNaFinalizacao || []) : pendencias(q, R);
    if (!final || P.length){
      secao(final ? "Pendências aceitas na finalização" : "Pendências para fechar a cotação");
      if (P.length) P.forEach(x => paragrafo(`•  ${x}`, 9)); else paragrafo("Nenhuma pendência encontrada.");
    }

    /* ---- comparativo por insumo com imagens ---- */
    doc.addPage(); y = 20;
    secao("Comparativo por insumo", "Todas as linhas cotadas, com a imagem do catálogo. O total de cada cartão considera a compra de todo o insumo com aquela linha. ESCOLHIDO indica a linha da decisão de compra até o momento; MENOR PREÇO, a opção mais barata entre todas as linhas.");
    const cols = 4, gap = 4, cwid = (W - 2 * M - (cols - 1) * gap) / cols, chei = 63, ih = 32;
    for (const ins of insumos){
      const glob = ins.itens.every(i => i.global);
      const fs = F.filter(f => ofertasDe(q, ins.id, f.id).length);
      const nao = F.filter(f => !ofertasDe(q, ins.id, f.id).length).map(f => f.nome);
      const comp = fs.filter(f => ins.total[f.id].falta === 0 && ins.total[f.id].total > 0).map(f => ins.total[f.id].total);
      const mn = comp.length > 1 ? Math.min(...comp) : null;
      if (y + 12 + chei > H - 16){ doc.addPage(); y = 20; }
      doc.setFillColor(...AREIA); doc.rect(M, y - 4, W - 2 * M, 8, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...TINTA); doc.text(T(ins.nome), M + 2, y + 1.5);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...CINZA);
      doc.text(T(`${glob ? "valor global" : `${qtdF(ins.qtd)} ${ins.un}`}${ins.orc ? ` · orçamento corrigido ${brl(ins.orc * R.fator)}` : ""}${nao.length ? ` · não cotado por: ${nao.join(", ")}` : ""}`), W - M - 2, y + 1.5, { align: "right", maxWidth: 170 });
      y += 7;
      if (!fs.length){ paragrafo("Nenhum fornecedor cotou este insumo.", 8.5); continue; }
      // um cartão por linha cotada: fornecedor na ordem das colunas; a linha selecionada primeiro, depois as demais por preço
      const cartoes = [];
      fs.forEach(f => {
        const escIds = new Set(ins.escolhidas[f.id] || []);
        ofertasDe(q, ins.id, f.id).slice().sort((a2, b2) => (escIds.has(b2.id) - escIds.has(a2.id)) || (precoUn(a2, glob) - precoUn(b2, glob)))
          .forEach(op => cartoes.push({ f, op, sel: escIds.has(op.id), total: glob ? num(op.preco) : ins.qtd * precoUn(op, glob) }));
      });
      const menorTot = Math.min(...cartoes.map(c => c.total).filter(t => t > 0));
      cartoes.forEach((c, k) => {
        if (k > 0 && k % cols === 0){ y += chei + gap; if (y + chei > H - 16){ doc.addPage(); y = 20; } }
        const x = M + (k % cols) * (cwid + gap), yy = y, { f, op } = c;
        const escolhido = c.sel && D.ins[ins.id]?.fid === f.id;
        const menor = cartoes.length > 1 && c.total > 0 && Math.abs(c.total - menorTot) < 0.005;
        doc.setDrawColor(...(escolhido ? VINHO : [221, 214, 205])); doc.setLineWidth(escolhido ? 0.6 : 0.2); doc.setFillColor(255, 255, 255); doc.roundedRect(x, yy, cwid, chei, 2, 2, "FD");
        const im = op.imagemId ? imgs[op.imagemId] : null;
        if (im){ const esc_ = Math.min((cwid - 6) / im.w, ih / im.h); const w = im.w * esc_, h = im.h * esc_; doc.addImage(im.data, "JPEG", x + (cwid - w) / 2, yy + 3 + (ih - h) / 2, w, h); }
        else { doc.setFillColor(...AREIA); doc.rect(x + 3, yy + 3, cwid - 6, ih, "F"); doc.setFontSize(8); doc.setTextColor(...CINZA); doc.text(T(op.imagemArquivada ? "imagem arquivada" : "sem imagem"), x + cwid / 2, yy + 3 + ih / 2, { align: "center" }); }
        let ty = yy + ih + 8;
        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(...VINHO); doc.text(T(f.nome || ""), x + 3, ty, { maxWidth: cwid - 34 });
        const tags = [escolhido && "ESCOLHIDO", menor && "MENOR PREÇO"].filter(Boolean);
        if (tags.length){ doc.setFontSize(6.5); doc.setTextColor(...(escolhido ? VINHO : VERDE)); doc.text(T(tags.join(" · ")), x + cwid - 3, ty, { align: "right" }); }
        else if (c.sel){ doc.setFont("helvetica", "normal"); doc.setFontSize(6.5); doc.setTextColor(...CINZA); doc.text(T("selecionada no comparativo"), x + cwid - 3, ty, { align: "right" }); }
        ty += 4.5; doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...TINTA);
        const linhaTxt = doc.splitTextToSize(T(op.linha || "-"), cwid - 6).slice(0, 2); doc.text(linhaTxt, x + 3, ty); ty += linhaTxt.length * 3.4;
        doc.setTextColor(...CINZA); doc.setFontSize(7.5);
        const emb = !glob && (op.unidVenda || num(op.contem) > 1) ? ` (${brl(num(op.preco))} / ${op.unidVenda || "unid."}${num(op.contem) > 1 ? ` c/ ${qtdF(num(op.contem))}` : ""})` : "";
        doc.text(T(`${brl(precoUn(op, glob))}${glob ? "" : ` / ${ins.un}`}${emb}`), x + 3, ty, { maxWidth: cwid - 6 });
        ty += 4; doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...(menor ? VERDE : TINTA));
        doc.text(T(`Total ${brl(c.total)}`), x + 3, ty);
        if (!glob && cartoes.length > 1 && !menor && menorTot > 0){ doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...CINZA); doc.text(T(`+${brl(c.total - menorTot)} em relação ao menor preço`), x + 3, ty + 3.8); }
      });
      y += chei + 9;
    }

    /* ---- anexos ---- */
    doc.addPage(); y = 20;
    secao("Anexo A · Quantitativos completos", `Total = ${formulaLegivel(m)}. Quantidades finais incluem as personalizações.`);
    const Dsc = m.descritivas, Cs = m.campos, GR = ehGranito(m);
    const corpoQ = [], estilos = [];
    for (const g of q.grupos){
      const G = R.grupos[g.id];
      corpoQ.push([g.nome || "Agrupador", ...Dsc.map(() => ""), ...(GR ? [""] : []), ...Cs.map(() => ""), G.qtd ? qtdF(G.qtd) : "", "", "", g.orcamento ? brl(num(g.orcamento)) : ""]); estilos.push("g");
      for (const p of g.n2){
        if (m.usaNivel2){ corpoQ.push([`   ${p.nome || m.nivel2Nome}`, ...Dsc.map(() => ""), ...(GR ? [""] : []), ...Cs.map(c => c.nivel === "n2" ? qtdF(num(p.valores[c.chave])) : ""), qtdF(R.n2[p.id].qtd), "", "", ""]); estilos.push("p"); }
        for (const it of p.itens){ const I = R.itens[it.id], ins = insumoDe(q, it.insumoId);
          corpoQ.push([`      ${ins?.nome || "-"}`, ...Dsc.map(d => it.desc[d.id] || ""), ...(GR ? [I.partes?.tipo || ""] : []), ...Cs.map(c => it.global ? "" : qtdF(num(I.vars[c.chave]))),
            it.global ? "VG" : qtdF(I.qtd), I.nPers ? `${I.persSoma > 0 ? "+" : ""}${qtdF(I.persSoma)}` : "", unidadeInsumo(q, ins), I.orc ? brl(I.orc) : ""]); estilos.push("i"); }
      }
    }
    tabela({ head: [[`Agrupador / ${m.usaNivel2 ? m.nivel2Nome.toLowerCase() + " / " : ""}${rotuloInsumo(m).toLowerCase()}`, ...Dsc.map(d => d.nome), ...(GR ? ["Tipo"] : []), ...Cs.map(c => c.nome), "Total", "Pers.", "Un", "Orçamento"]],
      body: corpoQ, styles: { font: "helvetica", fontSize: 7, cellPadding: 1.2, lineColor: [221, 214, 205], lineWidth: 0.1, textColor: TINTA },
      didParseCell: d => { if (d.section !== "body") return; const e = estilos[d.row.index]; if (e === "g"){ d.cell.styles.fillColor = ESC; d.cell.styles.textColor = 255; d.cell.styles.fontStyle = "bold"; } else if (e === "p"){ d.cell.styles.fillColor = AREIA; d.cell.styles.fontStyle = "bold"; } if (d.column.index > Dsc.length + (GR ? 1 : 0)) d.cell.styles.halign = "right"; } });

    const pers = []; q.grupos.forEach(g => g.n2.forEach(p => p.itens.forEach(it => (it.pers || []).forEach(x => pers.push([g.nome, p.nome, insumoDe(q, it.insumoId)?.nome || "", x.onde || "", `${num(x.qtd) > 0 ? "+" : ""}${qtdF(num(x.qtd))}`, x.motivo || ""])))));
    secao("Anexo B · Personalizações");
    if (pers.length) tabela({ head: [["Agrupador", m.usaNivel2 ? m.nivel2Nome : "", rotuloInsumo(m), "Onde", "Qtd (+/-)", "Motivo"]], body: pers, columnStyles: { 4: { halign: "right" } } });
    else paragrafo("Nenhuma personalização lançada.");

    secao("Anexo C · Todas as linhas cotadas", "Inclui as linhas não escolhidas. O preço por unidade já considera a embalagem informada.");
    const lc = [];
    for (const ins of insumos) for (const f of F) for (const op of ofertasDe(q, ins.id, f.id)){
      const usos = ins.itens.filter(it => R.itens[it.id].por[f.id]?.o?.id === op.id).length;
      lc.push([ins.nome, f.nome, op.linha || "", brl(num(op.preco)), op.unidVenda || "", num(op.contem) ? qtdF(num(op.contem)) : "1", brl(precoUn(op, ins.itens.every(i => i.global))), usos === 0 ? "não" : usos === ins.itens.length ? "sim" : `em ${usos} de ${ins.itens.length}`, op.imagemId ? "sim" : op.imagemArquivada ? "arquivada" : "-"]);
    }
    if (lc.length) tabela({ head: [["Insumo", "Fornecedor", "Linha / produto", "Preço cotado", "Unid. venda", "Contém", "Preço por un.", "Escolhida", "Imagem"]], body: lc, columnStyles: { 3: { halign: "right" }, 5: { halign: "right" }, 6: { halign: "right" } } });
    else paragrafo("Nenhuma linha cotada.");

    secao("Anexo D · Ficha completa dos fornecedores");
    if (F.length) tabelaFichas(true); else paragrafo("Nenhum fornecedor cadastrado.");

    secao("Anexo E · Orçamento e INCC");
    const ii = q.incc || {};
    tabela({ head: [["", "Mês", "Índice"]], body: [["INCC base (orçamento)", ii.mesBase ? mesBR(ii.mesBase) : "informado manualmente", R.inccBase ? inVal(R.inccBase) : "-"], ["INCC atual (T-1)", ii.mesAtual ? mesBR(ii.mesAtual) : "informado manualmente", R.inccAtual ? inVal(R.inccAtual) : "-"],
      [{ content: "Fator de correção", styles: { fontStyle: "bold" } }, "", { content: fat(R.fator), styles: { fontStyle: "bold" } }]], tableWidth: 150 });
    const orcL = [...q.grupos.filter(g => num(g.orcamento)).map(g => [`Agrupador: ${g.nome}`, brl(num(g.orcamento)), brl(num(g.orcamento) * R.fator)]),
      ...insumos.filter(x => x.orc).map(x => [`Insumo: ${x.nome}`, brl(x.orc), brl(x.orc * R.fator)]),
      [{ content: "TOTAL", styles: { fontStyle: "bold", fillColor: ROSA } }, { content: brl(R.orc), styles: { fontStyle: "bold", fillColor: ROSA } }, { content: brl(R.orcCorr), styles: { fontStyle: "bold", fillColor: ROSA } }]];
    tabela({ head: [["Orçamento", "Base", "Corrigido"]], body: orcL, columnStyles: { 1: { halign: "right" }, 2: { halign: "right" } }, tableWidth: 180 });

    secao("Observações e histórico");
    paragrafo(q.observacoes ? `Observações: ${q.observacoes}` : "Sem observações.");
    const hist = [...(q.historico || []).map(h => [new Date(h.quando).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }), h.quem, h.acao])];
    if (S.salvoEm) hist.push([S.salvoEm.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }), S.atualizadoPor || "", "última gravação"]);
    if (hist.length) tabela({ head: [["Quando", "Quem", "O quê"]], body: hist, tableWidth: 200 });

    if (final){
      secao("Aprovação");
      const campos = [["Responsável pela compra", q.comprador || ""], ["Aprovado por", q.aprovador || ""], ["Data", ""], ["Assinatura", ""]];
      if (y + campos.length * 12 > H - 16){ doc.addPage(); y = 24; }
      campos.forEach(([k, v]) => { doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...CINZA); doc.text(T(k.toUpperCase()), M, y);
        doc.setFont("helvetica", "normal"); doc.setTextColor(...TINTA); doc.text(T(v), M + 55, y - 1); doc.setDrawColor(...CINZA); doc.setLineWidth(0.2); doc.line(M + 55, y + 1, M + 180, y + 1); y += 12; });
    }

    /* ---- rodapé, cabeçalho e marca d'água ---- */
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++){
      doc.setPage(i);
      if (i > 1){ doc.setFillColor(...VINHO); doc.rect(0, 0, W, 9, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(255);
        doc.text(T(`QQP · ${titulo}`), M, 6); doc.text(T(final ? "RELATÓRIO FINAL" : "EM ANÁLISE · PRELIMINAR"), W - M, 6, { align: "right" }); }
      doc.setDrawColor(221, 214, 205); doc.setLineWidth(0.2); doc.line(M, H - 10, W - M, H - 10);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...CINZA);
      doc.text(T(`${titulo} · ${final ? "Finalizada" : "Preliminar, sujeito a alteração"}`), M, H - 6);
      doc.text(T(`Emitido em ${emitido} por ${S.user?.email || ""} · Página ${i} de ${n}`), W - M, H - 6, { align: "right" });
      if (!final){ doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity: 0.07 })); doc.setFont("helvetica", "bold"); doc.setFontSize(58); doc.setTextColor(...VINHO);
        doc.text(T("EM ANÁLISE · PRELIMINAR"), W / 2, H / 2 + 10, { align: "center", angle: 18 }); doc.restoreGraphicsState(); }
    }
    const nome = `Relatorio_${final ? "FINAL" : "PRELIMINAR"}_${q.codigoCompra || q.pacote}_${q.revisao}_${o?.nome || ""}`.replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_");
    doc.save(nome + ".pdf");
    window.__ultimoPdf = doc; // usado só em testes locais
    return true;
  } catch (ex){ console.error(ex); alert("Não foi possível gerar o PDF: " + ex.message); return false; }
}
</script>
</body>
</html>
