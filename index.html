<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQP · UQ-HUB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --paper:#FFFFFF; --ink:#1B2730; --muted:#5D6A72; --faint:#8A969C;
  --rule:#D6DDDB; --rule-strong:#B6C1BE;
  --primary:#0E5C63; --primary-hover:#0A4A50; --primary-soft:#DCEBEC;
  --lvl1:#1B2730; --lvl2:#E2E9E7; --lvl0:#0E5C63;
  --best:#D3EEDC; --best-ink:#145C35;
  --warn:#8A5300; --warn-bg:#FBEFD7;
  --danger:#A3302A; --danger-soft:#F7E2E0;
  --font:"Barlow", "Segoe UI", Arial, sans-serif;
  --font-cond:"Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hidden{display:none!important}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:.4em;border:1px solid var(--rule-strong);background:var(--paper);padding:.42em .9em;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(27,39,48,.06)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn.sm{padding:.2em .55em;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:transparent;cursor:pointer;color:var(--muted);width:26px;height:26px;border-radius:5px;font-size:14px;line-height:1}
.icon:hover{background:rgba(27,39,48,.08);color:var(--ink)}
.icon.del:hover{background:var(--danger-soft);color:var(--danger)}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login form{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:36px 34px;width:min(380px,100%)}
.login h1{font-size:44px;line-height:1;margin:0;font-weight:700;letter-spacing:-.02em}
.login p.sub{margin:.5em 0 1.6em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--rule-strong);border-radius:6px;padding:.55em .7em;background:#fff}
.field textarea{min-height:140px;font-family:var(--font-cond);resize:vertical}
.msg-erro{color:var(--danger);font-size:14px;min-height:1.4em;margin:0 0 10px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:54px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand small{font-weight:400;font-size:13px;color:#AEBBC0;margin-left:8px;letter-spacing:0}
.crumbs{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:15px}
.crumbs .sep{color:#6F8088}
.crumbs b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.top .status{font-size:13px;color:#AEBBC0;white-space:nowrap}
.top .status.dirty{color:#F5C46B}
.top .btn{background:transparent;border-color:#4A5B64;color:#fff}
.top .btn:hover{border-color:#fff}
.top .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.top .btn.primary:hover{background:#DCE7E5}
.top .user{font-size:13px;color:#AEBBC0}

/* ---------- abas ---------- */
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--rule);position:sticky;top:54px;z-index:25}
.tabs button{border:0;background:none;padding:12px 14px 10px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}

main{padding:20px}
.wrap{max-width:1180px;margin:0 auto}
h2{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
h3{font-size:17px;margin:0;font-weight:600}
p.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .spacer{flex:1}

/* ---------- lista de QQPs ---------- */
.lista{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.lista th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--rule);background:#F7F9F8}
.lista td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.lista tr:last-child td{border-bottom:0}
.lista tr.click{cursor:pointer}
.lista tr.click:hover td{background:#F4F8F7}
.lista .obra{font-weight:600}
.lista .n{text-align:right;font-variant-numeric:tabular-nums}
.lista .acoes{text-align:right;white-space:nowrap}
.vazio{background:var(--paper);border:1px dashed var(--rule-strong);border-radius:8px;padding:40px;text-align:center}
.vazio p{color:var(--muted);margin:.4em auto 1.2em;max-width:52ch}
.busca{border:1px solid var(--rule-strong);border-radius:6px;padding:.42em .7em;min-width:240px;background:#fff}

/* ---------- ranking ---------- */
.ranking{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px 10px;margin-bottom:16px}
.ranking .head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ranking .head .orc{color:var(--muted);font-size:14px}
.rk{display:grid;grid-template-columns:minmax(120px,190px) 1fr 140px 150px;gap:14px;align-items:center;padding:7px 0;border-top:1px solid var(--rule)}
.ranking .head + .rk{border-top:0}
.rk .nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nome small{display:block;font-weight:400;color:var(--warn);font-size:12px}
.rk .trilho{position:relative;height:18px;background:#EEF2F1;border-radius:3px}
.rk .barra{position:absolute;left:0;top:0;bottom:0;background:#9DB3B0;border-radius:3px}
.rk.melhor .barra{background:var(--primary)}
.rk .marco{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.rk .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rk .s{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.pos{color:var(--best-ink)} .neg{color:var(--danger)}
.legenda{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
.legenda i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px;border-radius:2px}

/* ---------- tabela QQP ---------- */
.scroller{overflow:auto;max-height:calc(100vh - 150px);background:var(--paper);border:1px solid var(--rule);border-radius:8px}
table.qqp{border-collapse:separate;border-spacing:0;font-family:var(--font-cond);font-size:14px;min-width:100%}
.qqp th,.qqp td{padding:5px 8px;border-bottom:1px solid var(--rule);border-right:1px solid #EBEFEE;white-space:nowrap}
.qqp thead th{position:sticky;top:0;z-index:5;background:#F3F6F5;font-weight:600;font-size:13px;color:var(--muted);text-align:center;vertical-align:bottom}
.qqp thead tr:nth-child(2) th{top:31px}
.qqp thead th.forn{color:var(--ink);font-size:14px;border-bottom:2px solid var(--ink);vertical-align:top}
.qqp thead th.forn small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:normal;max-width:260px;margin:0 auto}
.qqp .c0{position:sticky;left:0;z-index:4;background:inherit;min-width:300px;max-width:380px;text-align:left;border-right:1px solid var(--rule-strong)}
.qqp thead th.c0{z-index:6;background:#F3F6F5}
.qqp td.n{text-align:right;font-variant-numeric:tabular-nums}
.qqp td.linha{max-width:210px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.qqp td.sem{color:var(--faint);text-align:center}
.qqp .bl{border-left:2px solid var(--rule-strong)}
.qqp tr{background:var(--paper)}
.qqp tr.l0{background:var(--lvl0);color:#fff;font-weight:700}
.qqp tr.l0 td{border-bottom-color:var(--lvl0);font-size:15px}
.qqp tr.l1{background:var(--lvl1);color:#fff;font-weight:600}
.qqp tr.l1 td{border-bottom-color:#33434D;border-right-color:#33434D}
.qqp tr.l2{background:var(--lvl2);font-weight:600}
.qqp tr.l3 td.c0{padding-left:42px}
.qqp tr.l2 td.c0{padding-left:22px}
.qqp td.best{background:var(--best);color:var(--best-ink);font-weight:700}
.qqp tr.l1 td.best,.qqp tr.l0 td.best{background:#2E8B57;color:#fff}
.qqp td.falta{color:#F5C46B}
.qqp tr.l2 td.falta,.qqp tr.l3 td.falta{color:var(--warn)}
.caret{border:0;background:none;color:inherit;cursor:pointer;width:18px;padding:0;font-size:11px;opacity:.75}
.caret:hover{opacity:1}
.qqp tr.sec td{background:#F3F6F5;font-weight:600;color:var(--muted);font-size:13px;padding-top:16px}

/* edição */
.qqp input.in,.qqp select.in{border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 5px;font-family:var(--font-cond);font-size:14px;width:100%}
.qqp input.in:hover,.qqp select.in:hover{border-color:var(--rule-strong);background:#fff}
.qqp input.in:focus,.qqp select.in:focus{border-color:var(--primary);background:#fff;outline:none;box-shadow:0 0 0 2px var(--primary-soft)}
.qqp tr.l1 input.in{color:#fff;font-weight:600}
.qqp tr.l1 input.in:hover,.qqp tr.l1 input.in:focus{color:var(--ink)}
.qqp input.num{text-align:right;width:74px}
.qqp input.din{text-align:right;width:130px}
.qqp select.in{min-width:170px;max-width:240px}
.qqp select.in.vazio-sel{color:var(--faint)}
.qqp td.herd{color:var(--faint);text-align:right}
.qqp td.acoes{white-space:nowrap;text-align:right;position:sticky;right:0;z-index:3;background:inherit;box-shadow:-1px 0 0 var(--rule)}
.qqp th.acoes{position:sticky;right:0;z-index:6;background:#F3F6F5}
.qqp tr.l1 .icon{color:#C9D3D6}
.qqp tr.l1 .icon:hover{background:rgba(255,255,255,.12);color:#fff}
.grp-flex{display:flex;align-items:center;gap:8px}
.grp-flex label{font-size:12px;color:#AEBBC0;font-weight:400;white-space:nowrap}
.addrow td{background:#FAFBFB}
.addrow .btn{font-family:var(--font)}

/* ---------- fornecedores ---------- */
.forns{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:28px}
.forn-box{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:6px;padding:14px 14px 10px}
.forn-box .cab{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.forn-box .cab input{flex:1;font-size:17px;font-weight:600;border:1px solid transparent;border-radius:4px;padding:3px 6px}
.forn-box .cab input:hover,.forn-box .cab input:focus{border-color:var(--rule-strong)}
.forn-box .cond{width:100%;border:1px solid var(--rule);border-radius:4px;padding:5px 7px;font-size:14px;margin-bottom:10px}
.linhas{width:100%;border-collapse:collapse;font-family:var(--font-cond);font-size:14px}
.linhas th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:4px 4px;border-bottom:1px solid var(--rule)}
.linhas td{border-bottom:1px solid #EEF1F0;padding:1px 0}
.linhas input{width:100%;border:1px solid transparent;border-radius:4px;padding:4px 5px;font-family:var(--font-cond);font-size:14px;background:transparent}
.linhas input:hover,.linhas input:focus{border-color:var(--rule-strong);background:#fff}
.linhas input.din{text-align:right}
.linhas .usa{font-size:11px;color:var(--faint);text-align:center;width:46px}
.forn-box .rodape{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* ---------- dados ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 18px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px;margin-bottom:18px}
.form-grid .full{grid-column:1/-1}
.fator{font-family:var(--font-cond);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:4px}

/* ---------- modal / avisos ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(27,39,48,.45);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--paper);border-radius:10px;padding:22px 24px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal h3{margin-bottom:6px}
.modal p{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.radio{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
.radio input{margin-top:4px}
.radio small{display:block;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid #EBCB8F;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.carregando{padding:60px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .top .user,.brand small{display:none}
  .rk{grid-template-columns:1fr 110px;row-gap:4px}
  .rk .trilho{grid-column:1/-1;order:3}
  .rk .s{grid-column:2}
  main{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= v2 ================= */
.top nav.menu{display:flex;gap:4px;margin-left:8px}
.top nav.menu button{background:none;border:0;color:#AEBBC0;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:500}
.top nav.menu button:hover{color:#fff;background:rgba(255,255,255,.08)}
.top nav.menu button[aria-current="true"]{color:#fff;background:rgba(255,255,255,.14)}
.crumbs button{background:none;border:0;color:#fff;font-weight:600;cursor:pointer;padding:0;font-size:15px}
.crumbs button:hover{text-decoration:underline}

/* obras */
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.obra-card{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--primary);border-radius:6px;padding:16px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit}
.obra-card:hover{border-color:var(--rule-strong);border-left-color:var(--primary-hover);background:#FBFCFC}
.obra-card .nome{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.obra-card .meta{color:var(--muted);font-size:14px}
.carteira{margin-bottom:18px}
.carteira h3{margin:0 0 6px;font-size:16px}
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.sub-tabs button{border:1px solid var(--rule-strong);background:var(--paper);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.sub-tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* centralizar quantidades */
.qqp td.cq,.qqp th.cq{text-align:center}
.qqp input.in.num{text-align:center;width:78px;margin:0 auto;display:block}
.qqp td.herd{text-align:center}
.qqp td.un{color:var(--muted);text-align:center;font-size:13px}
.qqp td.desc-col{color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.qqp input.in.desc{min-width:110px}
.qqp input.in::placeholder{color:#A9B4B8}

/* comparativo com escolha de linha */
.qqp select.esc{min-width:150px;max-width:230px;font-size:13px;padding:2px 4px;border:1px solid transparent;background:transparent;border-radius:4px;font-family:var(--font-cond);color:var(--ink)}
.qqp select.esc:hover,.qqp select.esc:focus{border-color:var(--rule-strong);background:#fff}
.qqp select.esc.auto{color:var(--muted)}
.qqp tr.l1 select.esc{color:#fff}
.qqp tr.l1 select.esc:focus,.qqp tr.l1 select.esc:hover{color:var(--ink)}
.qqp .emb{display:block;font-size:11px;color:var(--faint);font-weight:400;line-height:1.1}
.qqp .aviso{color:var(--warn);cursor:help;margin-left:3px}
.qqp tr.l0b{background:#E7F0EF;font-weight:600}
.qqp tr.l0b td{border-bottom-color:#C9D9D7}
.qqp tr.l0b td.c0{background:#E7F0EF}
.qqp thead th.forn .ficha{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:normal;max-width:300px;margin:2px auto 0;line-height:1.3}
.qqp td.vg{color:var(--muted);text-align:center;font-size:13px}

/* filtro de fornecedores */
details.filtro{position:relative}
details.filtro summary{list-style:none;cursor:pointer;border:1px solid var(--rule-strong);background:var(--paper);border-radius:6px;padding:.42em .9em;font-weight:500;user-select:none}
details.filtro summary::-webkit-details-marker{display:none}
details.filtro summary::after{content:" ▾";color:var(--muted)}
details.filtro[open] summary{border-color:var(--ink)}
details.filtro .painel{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--rule-strong);border-radius:8px;box-shadow:0 10px 30px rgba(27,39,48,.15);padding:8px;z-index:40;min-width:240px}
details.filtro label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;cursor:pointer}
details.filtro label:hover{background:#F2F5F4}
details.filtro .acts{display:flex;gap:6px;border-top:1px solid var(--rule);margin-top:6px;padding-top:8px}

/* ficha do fornecedor */
.forn-box .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:10px}
.forn-box .grid2 .full{grid-column:1/-1}
.mini{display:flex;flex-direction:column;gap:2px}
.mini label{font-size:12px;color:var(--muted)}
.mini input,.mini select{border:1px solid var(--rule);border-radius:4px;padding:4px 7px;font-size:14px;background:#fff;width:100%}
.mini input:focus,.mini select:focus{border-color:var(--primary);outline:none}
.forn-box h4{margin:12px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.ajuste-total{font-size:13px;color:var(--muted);margin-top:6px}

/* preços por insumo */
.insumo-bloco{background:var(--paper);border:1px solid var(--rule);border-radius:8px;margin-bottom:12px;overflow:hidden}
.insumo-bloco .cab{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#F3F6F5;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.insumo-bloco .cab input.nome{font-weight:600;font-size:16px;border:1px solid transparent;border-radius:4px;padding:3px 6px;background:transparent;min-width:260px;flex:1}
.insumo-bloco .cab input.nome:hover,.insumo-bloco .cab input.nome:focus{border-color:var(--rule-strong);background:#fff}
.insumo-bloco .cab .info{color:var(--muted);font-size:14px;white-space:nowrap}
.insumo-bloco .cab input.un{width:64px;text-align:center;border:1px solid var(--rule);border-radius:4px;padding:3px}
table.ofertas{width:100%;border-collapse:collapse;font-family:var(--font-cond);font-size:14px}
table.ofertas th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--rule)}
table.ofertas td{padding:2px 6px;border-bottom:1px solid #EEF1F0}
table.ofertas tr.sep td{border-top:1px solid var(--rule-strong)}
table.ofertas input,table.ofertas select{width:100%;border:1px solid transparent;border-radius:4px;padding:4px 5px;font-family:var(--font-cond);font-size:14px;background:transparent}
table.ofertas input:hover,table.ofertas input:focus,table.ofertas select:hover,table.ofertas select:focus{border-color:var(--rule-strong);background:#fff;outline:none}
table.ofertas .r{text-align:right}

.legivel{font-family:var(--font-cond);font-size:16px;margin-top:4px}
.previa{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.previa .mini input{width:90px;text-align:center}
.previa .res{font-family:var(--font-cond);font-size:22px;font-weight:700;padding-bottom:2px}
.secao{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin-bottom:16px}

table.campos input,table.campos select{width:100%;border:1px solid var(--rule);border-radius:4px;padding:4px 6px;font-size:14px;background:#fff}
table.campos code{font-family:var(--font-cond);color:var(--muted);font-size:13px}
.modelo-lista td .legivel{font-size:14px;margin:0;color:var(--muted)}

table.incc{border-collapse:collapse;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;font-variant-numeric:tabular-nums}

/* ================= tema UQ-HUB ================= */
:root{
  --bg:#F4F1EC; --paper:#FFFFFF; --sand:#FAF7F2; --sand-2:#F2EDE6;
  --ink:#1C1A18; --muted:#7D756B; --faint:#A39B91;
  --rule:#E6E1DA; --rule-strong:#D2CFCB;
  --primary:#7A1930; --primary-hover:#5E1325; --primary-soft:#EEE1E4; --primary-pill:#E4D5D3;
  --wine-dark:#3D0F1A;
  --lvl0:#7A1930; --lvl1:#3D0F1A; --lvl2:#F2EDE6;
  --best:#E3EFE1; --best-ink:#137A3A; --green:#16A34A;
  --warn:#9A5B00; --warn-bg:#FBF1DE;
  --danger:#B42318; --danger-soft:#FBE7E4;
  --font:"Archivo", "Segoe UI", Arial, sans-serif;
  --font-cond:"Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-wide:"Archivo", "Segoe UI", Arial, sans-serif;
  --font-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
body{color:var(--ink)}
.eyebrow,.field label,.mini label,.lista th,table.campos th,table.ofertas th,table.linhas th,table.incc th{
  text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--muted)}
h2{font-family:var(--font-wide);font-stretch:118%;font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:20px;color:var(--primary)}
h3{font-weight:600}

/* botões em pílula, como no hub */
.btn{border-radius:999px;border-color:var(--rule-strong);background:var(--paper);color:var(--ink);padding:.42em 1em}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.icon:hover{background:var(--primary-soft);color:var(--primary)}

/* campos com fundo areia */
.field input,.field select,.field textarea,.busca,.mini input,.mini select{background:var(--sand);border-color:var(--rule-strong);border-radius:8px}
.field input:focus,.field select:focus,.field textarea:focus,.mini input:focus,.mini select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft);background:#fff}
:focus-visible{outline-color:var(--primary)}

/* barra superior clara com a marca em vinho */
.top{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--rule);height:60px}
.brand{color:var(--primary);font-family:var(--font-wide);font-stretch:125%;font-weight:800;letter-spacing:.12em;font-size:20px}
.brand small{color:var(--muted)}
.top nav.menu button{color:var(--muted);border-radius:8px;position:relative}
.top nav.menu button:hover{color:var(--primary);background:var(--sand)}
.top nav.menu button[aria-current="true"]{color:var(--ink);background:#EEEEEE}
.top nav.menu button[aria-current="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--wine-dark)}
.crumbs{font-family:var(--font-wide);font-stretch:118%;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.crumbs .sep{color:var(--faint)}
.crumbs b{color:var(--primary);font-weight:700}
.crumbs button{color:var(--ink);font-family:inherit;font-stretch:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit}
.top .status{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.top .status.dirty{color:var(--warn)}
.top .user{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.top .btn{background:var(--paper);border-color:var(--rule-strong);color:var(--ink)}
.top .btn:hover{border-color:var(--primary);color:var(--primary)}
.top .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.top .btn.primary:hover{background:var(--primary-hover);color:#fff}

/* abas com sublinhado vinho */
.tabs{top:60px;background:var(--bg);border-bottom:1px solid var(--rule-strong)}
.tabs button{color:var(--muted)}
.tabs button:hover{color:var(--primary)}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.sub-tabs button{background:var(--paper);border-color:var(--rule-strong);color:var(--ink)}
.sub-tabs button:hover{border-color:var(--primary);color:var(--primary)}
.sub-tabs button[aria-selected="true"]{background:var(--primary-pill);color:var(--wine-dark);border-color:#CDB5B3}

/* listas e cartões */
.lista{border-color:var(--rule);border-radius:12px}
.lista th{background:var(--sand)}
.lista tr.click:hover td{background:var(--sand)}
.lista .obra{color:var(--ink)}
.obra-card{border-left-color:var(--primary);border-radius:12px}
.obra-card:hover{background:var(--sand);border-left-color:var(--wine-dark)}
.obra-card .nome{font-family:var(--font-wide);font-stretch:118%;text-transform:uppercase;letter-spacing:.03em;font-size:21px;color:var(--primary)}
.vazio{border-color:var(--rule-strong);border-radius:12px}
.tag{background:var(--primary-soft);color:var(--primary);border:1px solid #DCC3C9;border-radius:6px}
.pos{color:var(--green)}

/* ranking */
.ranking{border-radius:12px}
.rk .trilho{background:var(--sand-2)}
.rk .barra{background:#C9B2B8}
.rk.melhor .barra{background:var(--primary)}
.rk .marco{background:var(--ink)}
.legenda i{border-radius:3px}

/* tabela QQP */
.scroller{border-radius:12px}
.qqp thead th,.qqp thead th.c0,.qqp th.acoes{background:var(--sand)}
.qqp thead th{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.qqp thead th.forn{font-family:var(--font-wide);font-stretch:112%;font-size:13px;letter-spacing:.04em;color:var(--primary);border-bottom-color:var(--primary)}
.qqp thead th.forn .ficha{text-transform:none;letter-spacing:0;font-family:var(--font);font-stretch:100%}
.qqp tr.l0{background:var(--lvl0)}
.qqp tr.l0 td{border-bottom-color:var(--lvl0)}
.qqp tr.l0b,.qqp tr.l0b td.c0{background:var(--primary-soft)}
.qqp tr.l0b td{border-bottom-color:#DCC3C9}
.qqp tr.l1{background:var(--lvl1)}
.qqp tr.l1 td{border-bottom-color:#5A2531;border-right-color:#5A2531}
.qqp tr.l2{background:var(--lvl2)}
.qqp tr.sec td{background:var(--sand)}
.qqp td.best{background:var(--best);color:var(--best-ink)}
.qqp tr.l1 td.best,.qqp tr.l0 td.best{background:var(--green);color:#fff}
.qqp td.falta{color:#F7C98B}
.qqp input.in:focus,.qqp select.in:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.qqp tr.l1 .icon:hover{background:rgba(255,255,255,.14);color:#fff}
.addrow td{background:var(--sand)}

/* fornecedores, insumos, modelos */
.forn-box{border-top-color:var(--primary);border-radius:12px}
.forn-box .cab input{font-family:var(--font-wide);font-stretch:112%;text-transform:uppercase;letter-spacing:.03em;font-size:16px;color:var(--primary)}
.insumo-bloco{border-radius:12px}
.insumo-bloco .cab{background:var(--sand)}
.secao{border-radius:12px}
.chip{border-color:#DCC3C9;color:var(--primary);background:var(--primary-soft)}
.chip:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.op:hover{background:var(--wine-dark);border-color:var(--wine-dark)}
.formula-in{border-radius:8px;background:var(--sand)}
.formula-in:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
.formula-ok{color:var(--green)}
.form-grid{border-radius:12px}
.fator{color:var(--primary)}
table.incc{border-radius:12px}
details.filtro summary{border-radius:999px;border-color:var(--rule-strong)}
details.filtro[open] summary{border-color:var(--primary);color:var(--primary)}
details.filtro .painel{border-radius:12px}
details.filtro label:hover{background:var(--sand)}

/* login */
.login form{border-radius:14px}
.login h1{color:var(--primary);font-family:var(--font-wide);font-stretch:125%;letter-spacing:.1em}

/* avisos */
.toast{background:var(--wine-dark);border-radius:999px;padding:10px 20px}
.modal{border-radius:14px}
.modal h3{color:var(--primary)}

/* decisão de compra */
.rk.decidida .barra{background:var(--green)}
.rk.decidida{background:linear-gradient(90deg,rgba(22,163,74,.06),transparent);border-radius:8px;padding-left:6px;padding-right:6px}
.qqp td.dec-td{padding:3px 4px}
.dec-cel{width:100%;min-width:130px;text-align:right;font-family:var(--font-cond);font-size:14px;font-variant-numeric:tabular-nums;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--ink)}
.dec-cel:hover:not(:disabled){border-color:var(--rule-strong);background:var(--sand)}
.dec-cel.best{color:var(--best-ink);font-weight:600}
.dec-cel.sel{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
.dec-cel.sel::before{content:"✓ ";}
.dec-cel:disabled{cursor:default}
.dec-cel .nc{color:var(--faint);font-weight:400}
.dec-resumo{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.dec-forn{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;font-family:var(--font-cond);font-size:14px}
.dec-forn th{text-align:left;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);background:var(--sand);padding:8px 10px;border-bottom:1px solid var(--rule)}
.dec-forn th.n,.dec-forn td.n{text-align:right;font-variant-numeric:tabular-nums}
.dec-forn td{padding:7px 10px;border-bottom:1px solid var(--rule)}
.dec-forn .emb{display:block;font-size:11px;color:var(--faint)}
.dec-cards{display:grid;gap:10px}
.dc{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.dc span{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--muted)}
.dc b{font-family:var(--font-wide);font-stretch:112%;font-size:22px;font-variant-numeric:tabular-nums}
.dc small{color:var(--muted);font-size:12px}
.dc.ok{border-color:#BFE2CB;background:#F3FAF5}.dc.ok b{color:var(--green)}
.dc.ruim{border-color:#F1C4BE;background:#FDF3F1}.dc.ruim b{color:var(--danger)}
@media (max-width:900px){.dec-resumo{grid-template-columns:1fr}}

/* batente de porta */
.bat-btn{border:1px solid var(--rule-strong);background:var(--paper);border-radius:999px;font-size:11px;padding:1px 7px;cursor:pointer;white-space:nowrap;color:var(--muted);font-family:var(--font)}
.bat-btn:hover{border-color:var(--primary);color:var(--primary)}
.bat-btn.alerta{border-color:#E8C27A;background:var(--warn-bg);color:var(--warn);font-weight:600}
.bat-ok{color:var(--green);font-weight:700;font-size:13px}

/* imagens */
.thumb{width:44px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--rule);border-radius:6px;display:block}
.thumb:not([src]),.thumb[src=""]{background:var(--sand)}
.thumb-btn{border:0;background:none;padding:0;cursor:zoom-in;border-radius:6px}
.thumb-btn:hover .thumb{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.thumb-btn.mini .thumb{width:28px;height:28px}
.esc-wrap{display:flex;align-items:center;gap:4px}
.cola{border:2px dashed var(--rule-strong);border-radius:12px;min-height:200px;display:grid;place-items:center;padding:12px;background:var(--sand);outline:none;text-align:center}
.cola:focus,.cola.sobre{border-color:var(--primary);background:var(--primary-soft)}
.cola-txt{color:var(--muted);line-height:1.6}
.cola img{max-width:100%;max-height:340px;border-radius:6px}
.lightbox img{width:100%;max-height:72vh;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--rule)}
.lightbox p{margin:10px 0 0;color:var(--ink);font-family:var(--font-cond);font-size:15px}
/* status */
.chip-status{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.chip-status.fin{background:var(--best);color:var(--best-ink);border:1px solid #BFE2CB}
.banner.fin{background:#F3FAF5;border-color:#BFE2CB;color:var(--best-ink)}
.travada input:disabled,.travada select:disabled,.travada textarea:disabled{opacity:1;color:var(--ink);cursor:default;background:transparent}
</style>
</head>

function inccValor(mes){ return S.incc.find(x => x.mes === mes)?.valor ?? null; }
function inccDaQQP(q){
  const i = q.incc || {};
  const base = i.mesBase ? inccValor(i.mesBase) : num(i.base) || null;
  const atual = i.mesAtual ? inccValor(i.mesAtual) : num(i.atual) || null;
  const fator = base > 0 && atual > 0 ? atual / base : 1;
  const faltando = (i.mesBase && !inccValor(i.mesBase)) || (i.mesAtual && !inccValor(i.mesAtual));
  return { base, atual, fator, faltando };
}

/* ---------------- cálculo ---------------- */
function precoUn(o, global){ return global ? num(o.preco) : num(o.preco) / (num(o.contem) || 1); }
function ofertasDe(q, insumoId, fornId){
  return q.ofertas.filter(o => o.insumoId === insumoId && o.fornId === fornId);
}
function calc(q){
  const F = q.fornecedores, m = q.modelo;
  let ast = null, erroFormula = null;
  try { ast = compilar(m.formula, chavesDe(m)); } catch (e){ erroFormula = e.message; }
  const { fator, base: inccBase, atual: inccAtual, faltando: inccFaltando } = inccDaQQP(q);
  const zero = () => Object.fromEntries(F.map(f => [f.id, { total: 0, falta: 0 }]));
  const R = { nItens: 0, fator, inccBase, inccAtual, inccFaltando, erroFormula, total: zero(), orc: 0, orcCorr: 0, grupos: {}, n2: {}, itens: {}, insumos: new Map(), final: {} };
  const porInsumoForn = {};
  for (const o of q.ofertas){ ((porInsumoForn[o.insumoId] ??= {})[o.fornId] ??= []).push(o); }
  for (const g of q.grupos){
    const G = { total: zero(), orc: num(g.orcamento), qtd: 0 };
    R.grupos[g.id] = G;
    for (const p of g.n2){
      const P = { total: zero(), qtd: 0, orc: 0 }; R.n2[p.id] = P;
      for (const it of p.itens){
        const vars = { ...p.valores };
        for (const [k, v] of Object.entries(it.valores || {})) if (v !== null && v !== "" && v !== undefined) vars[k] = v;
        let partes = null;
        if (ehGranito(m)){ partes = areaGranito(m, it, vars); vars.area_unit = partes.total; }
        const qtdBase = it.global ? 1 : (ast ? avaliar(ast, vars) : 0);
        const persSoma = it.global ? 0 : (it.pers || []).reduce((t, x) => t + num(x.qtd), 0);
        const qtd = qtdBase + persSoma;
        const orcIt = it.orcValor == null ? 0 : (it.orcModo === "unit" ? num(it.orcValor) * qtd : num(it.orcValor));
        P.qtd += it.global ? 0 : qtd; G.qtd += it.global ? 0 : qtd;
        P.orc += orcIt; G.orc += orcIt;
        const I = { qtd, base: qtdBase, persSoma, nPers: (it.pers || []).length, vars, orc: orcIt, por: {}, partes };
        const ins = insumoDe(q, it.insumoId);
        const k = it.insumoId || "_sem";
        if (!R.insumos.has(k)) R.insumos.set(k, { id: it.insumoId, nome: ins?.nome || "(sem insumo)", un: unidadeInsumo(q, ins), qtd: 0, orc: 0, total: zero(), itens: [], escolhidas: {} });
        const INS = R.insumos.get(k); INS.qtd += it.global ? 0 : qtd; INS.orc += orcIt; INS.itens.push(it);
        if (qtd > 0 || it.global) R.nItens++;
        for (const f of F){
          const ops = (porInsumoForn[it.insumoId]?.[f.id] || []);
          const escId = it.escolhas?.[f.id];
          let o = null, auto = false;
          if (escId === "__none") o = null;
          else if (escId && ops.find(x => x.id === escId)) o = ops.find(x => x.id === escId);
          else if (ops.length){ o = ops.reduce((a, b) => precoUn(b, it.global) < precoUn(a, it.global) ? b : a); auto = true; }
          if (o){
            const unit = precoUn(o, it.global), tot = it.global ? unit : qtd * unit;
            I.por[f.id] = { o, unit, total: tot, auto, n: ops.length };
            for (const X of [P, G, R, INS]) X.total[f.id].total += tot;
            (INS.escolhidas[f.id] ??= new Set()).add(o.id);
          } else {
            I.por[f.id] = { o: null, n: ops.length, none: escId === "__none" };
            if (qtd > 0 || it.global) for (const X of [P, G, R, INS]) X.total[f.id].falta++;
          }
        }
        const vals = F.filter(f => !S.ocultos.has(f.id)).map(f => I.por[f.id]).filter(x => x.o).map(x => x.total);
        I.min = vals.length > 1 ? Math.min(...vals) : null;
        const embs = new Set(F.map(f => I.por[f.id]).filter(x => x.o && x.o.unidVenda).map(x => chave(x.o.unidVenda) + "|" + num(x.o.contem)));

    const outros = (a.outros || []).reduce((s, x) => s + num(x.valor), 0);
    const ajuste = num(a.frete) + outros - desconto;

    const a = F.find(f => f.id === fid).ajustes || {};
    const desconto = x.sub * num(a.descontoPct) / 100 + num(a.descontoValor);
    x.ajuste = num(a.frete) + (a.outros || []).reduce((t, o) => t + num(o.valor), 0) - desconto;
    x.total = x.sub + x.ajuste; DEC.base += x.sub; DEC.total += x.total;

}
function menorDe(tot, F){
  const ok = F.filter(f => tot[f.id].falta === 0 && tot[f.id].total > 0).map(f => tot[f.id].total);
  return ok.length > 1 ? Math.min(...ok) : null;
}
function resumoPara(q){
  const R = calc(q);
  const totais = q.fornecedores.map(f => ({ nome: f.nome || "?", total: R.final[f.id].total, falta: R.final[f.id].falta }))
    .sort((a, b) => (a.falta - b.falta) || (a.total - b.total));

    decisao: D.definidos ? { total: D.total, definidos: D.definidos, pendentes: D.pendentes, fornecedores: Object.keys(D.porForn).map(id => q.fornecedores.find(f => f.id === id)?.nome || "?") } : null };
}

async function carregarBase(){

    await Promise.all(padrao.map(m => { const { id, ...r } = m; return setDoc(doc(db, C_MOD, id), r); }));
    S.modelos = padrao;
  }

  const mig = await getDoc(doc(db, C_CFG, "migracoes")); const migs = mig.exists() ? mig.data() : {};

    if (!S.modelos.some(ehGranito)){ const g = { id: uid(), ...modeloGranito() }; const { id, ...r } = g; await setDoc(doc(db, C_MOD, id), r); S.modelos.push(g); }

  }
  // migração: modelo de portas passa a seguir a aba BASE (repetições × qtd por pavimento, batente como informação)
  if (!migs.portas2){
    const alvo = S.modelos.filter(m => (m.campos || []).some(c => /^bat_/.test(c.chave)) || (chave(m.nome) === "PORTAS" && m.especial !== "portas"));
    for (const m of alvo){ const novo = { ...modeloPortas(), nome: m.nome }; Object.keys(m).forEach(k => { if (k !== "id") delete m[k]; }); Object.assign(m, novo); const { id, ...r } = m; await setDoc(doc(db, C_MOD, id), r); }
    if (!S.modelos.some(m => m.especial === "portas")){ const g = { id: uid(), ...modeloPortas() }; const { id, ...r } = g; await setDoc(doc(db, C_MOD, id), r); S.modelos.push(g); }
    await setDoc(doc(db, C_CFG, "migracoes"), { ...migs, portas2: true });
  }
  S.modelos.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
  S.incc = (inc.exists() ? inc.data().serie : []) || [];
  S.incc.sort((a, b) => a.mes.localeCompare(b.mes));
  S.embalagens = (emb.exists() ? emb.data().lista : []) || [];
}

/* ---------------- abrir / salvar QQP ---------------- */
async function abrirQQP(id){
  fecharQQP();
  const item = S.qqps.find(x => x.id === id);
  if (!item) return;
  S.id = id; S.q = normalizarQQP(clone(semMeta({ ...item, atualizadoEm: null }))); S.versao = item.versao || 0;
  S.dirty = false; S.tab = "comp"; S.ocultos = new Set();
  S.salvoEm = item.atualizadoEm?.toDate ? item.atualizadoEm.toDate() : null; S.atualizadoPor = item.atualizadoPor || "";
  S.view = "qqp"; render();
  S.unsub = onSnapshot(doc(db, C_QQP, id), snap => {
    if (snap.metadata?.hasPendingWrites || !snap.exists()) return;
    const d = snap.data(); const v = d.versao || 0;
    if (v <= S.versao) return;
    if (!S.dirty){
      S.q = normalizarQQP(clone(semMeta({ ...d, atualizadoEm: null }))); S.versao = v; S.salvoEm = d.atualizadoEm?.toDate?.() || new Date();
      render(); toast("QQP atualizada com alterações salvas em outro computador.");
    } else { S.remotoPendente = { ...d, atualizadoEm: null }; render(); }
  });
}
function fecharQQP(){ if (S.unsub) S.unsub(); S.unsub = null; S.id = null; S.q = null; S.dirty = false; S.remotoPendente = null; }
async function sairDaQQP(destino = "obra"){
  if (S.dirty && !confirm("Há alterações não salvas nesta QQP. Sair mesmo assim?")) return false;
  fecharQQP(); S.view = destino;
  if (destino === "obra"){ S.qqpsCarregando = true; render(); await carregarQQPsDaObra(); S.qqpsCarregando = false; }
  render(); return true;
}
async function salvar(forcar = false){
  if (!S.q || S.salvando) return;
  S.salvando = true; atualizarStatus();
  const ref = S.id ? doc(db, C_QQP, S.id) : doc(collection(db, C_QQP));
  try {
    await enviarImagensPendentes(ref.id);
  } catch (ex){ S.salvando = false; atualizarStatus(); alert("Não foi possível gravar as imagens: " + ex.message); return; }
  const dados = clone(S.q);
  dados.resumo = resumoPara(S.q);
  try {
    const nova = await runTransaction(db, async tx => {
      const snap = await tx.get(ref);
      const atual = snap.exists() ? (snap.data().versao || 0) : 0;
      if (snap.exists() && atual !== S.versao && !forcar){ const e = new Error("conflito"); e.conflito = { ...snap.data(), atualizadoEm: null }; throw e; }
      tx.set(ref, { ...dados, versao: atual + 1, atualizadoEm: serverTimestamp(), atualizadoPor: S.user?.email || "" });
      return atual + 1;
    });
    S.id = ref.id; S.versao = nova; S.dirty = false; S.salvoEm = new Date(); S.remotoPendente = null;
    S.salvando = false; render(); toast("QQP salva.");
    if (!S.unsub) abrirEscuta();
    guardarEmbalagens();
  } catch (ex){
    S.salvando = false; atualizarStatus();
    if (ex.conflito){ S.remotoPendente = ex.conflito; render(); }
    else { console.error(ex); alert("Não foi possível salvar: " + ex.message); }
  }
}
function abrirEscuta(){
  const id = S.id;
  S.unsub = onSnapshot(doc(db, C_QQP, id), snap => {
    if (snap.metadata?.hasPendingWrites || !snap.exists() || S.id !== id) return;
    const d = snap.data(); if ((d.versao || 0) <= S.versao) return;
    if (!S.dirty){ S.q = normalizarQQP(clone(semMeta({ ...d, atualizadoEm: null }))); S.versao = d.versao; render(); toast("QQP atualizada com alterações salvas em outro computador."); }
    else { S.remotoPendente = { ...d, atualizadoEm: null }; render(); }
  });
}
async function guardarEmbalagens(){
  const novas = [];
  for (const o of S.q.ofertas){
    const n = String(o.unidVenda || "").trim(); if (!n || !num(o.contem)) continue;
    if (!S.embalagens.find(e => chave(e.nome) === chave(n) && num(e.contem) === num(o.contem)) && !novas.find(e => chave(e.nome) === chave(n)))
      novas.push({ nome: n, contem: num(o.contem) });
  }
  if (!novas.length) return;
  S.embalagens = [...S.embalagens, ...novas].sort((a, b) => a.nome.localeCompare(b.nome));
  try { await setDoc(doc(db, C_CFG, "embalagens"), { lista: S.embalagens }); } catch (e){ console.warn(e); }
}
function marcarAlterado(){ if (!S.dirty){ S.dirty = true; atualizarStatus(); } }
function atualizarStatus(){
  const el = document.getElementById("status"); if (!el) return;
  el.className = "status" + (S.dirty ? " dirty" : "");
  el.textContent = S.salvando ? "Salvando…" : S.dirty ? "Alterações não salvas" :
    S.salvoEm ? "Salvo às " + S.salvoEm.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "Não salva";
}

function filtroFornecedores(){

/* ----- comparativo ----- */
function abaComparativo(){
  const q = S.q, F = fornVisiveis(q), R = calc(q), m = q.modelo;
  if (!q.grupos.length || !q.fornecedores.length){
    return `<div class="wrap"><div class="vazio"><h3>O comparativo aparece aqui</h3>
      <p>Cadastre agrupadores, ${esc((m.nivel2Nome || "pavimentos").toLowerCase())} e insumos em Quantitativos, e os fornecedores com as linhas cotadas em Fornecedores e preços.</p>
      <button class="btn primary" data-act="tab" data-tab="${q.grupos.length ? "forn" : "quant"}">${q.grupos.length ? "Cadastrar fornecedores" : "Cadastrar quantitativos"}</button></div></div>`;
  }
  return `<div class="bar"><div><h2>Comparativo</h2></div><div class="spacer"></div>
      <button class="btn sm" data-act="expandir">Expandir tudo</button><button class="btn sm" data-act="recolher">Recolher ${esc((m.nivel2Nome || "nível 2").toLowerCase())}</button>${filtroFornecedores()}</div>`
    + ranking(R, F) + `<div class="scroller" id="scComp"><table class="qqp">${cabecalhoComp(q, F)}<tbody>${corpoComp(q, R, F)}</tbody></table></div>`
    + secaoDecisao(q, R, F);
}
function secaoDecisao(q, R, F){
  const D = R.decisao, todos = q.fornecedores;
  const insumos = [...R.insumos.values()].filter(x => x.id);
  if (!insumos.length) return "";
  const linhas = insumos.map(ins => {
    const esc_ = D.ins[ins.id];
    const comp = F.filter(f => ins.total[f.id].falta === 0 && ins.total[f.id].total > 0).map(f => ins.total[f.id].total);
    const mn = comp.length > 1 ? Math.min(...comp) : null;
    const orcC = ins.orc ? ins.orc * R.fator : null;
    return `<tr class="l3"><td class="c0" style="padding-left:12px">${esc(ins.nome)}</td>
      <td class="n cq">${ins.itens.every(i => i.global) ? "VG" : qtdF(ins.qtd)}</td><td class="un">${esc(ins.un)}</td>
      ${F.map(f => { const t = ins.total[f.id]; const nada = t.total === 0;
        const sel = esc_?.fid === f.id; const best = mn !== null && t.falta === 0 && Math.abs(t.total - mn) < 0.005;
        return `<td class="bl dec-td"><button class="dec-cel ${sel ? "sel" : ""} ${best ? "best" : ""}" data-act="decidir" data-ins="${ins.id}" data-f="${f.id}" aria-pressed="${sel}" ${nada ? "disabled" : ""}
          title="${nada ? "Não cotado" : sel ? "Clique para desfazer a escolha" : "Comprar este insumo deste fornecedor"}">
          ${nada ? `<span class="nc">não cotado</span>` : `${brl(t.total)}${t.falta ? `<span class="emb">parcial</span>` : ""}`}</button></td>`; }).join("")}
      <td class="bl" style="font-weight:600">${esc_ ? esc(todos.find(f => f.id === esc_.fid)?.nome || "") : `<span style="color:var(--faint);font-weight:400">a definir</span>`}${esc_?.falta ? `<span class="emb" style="color:var(--warn)">não cotou ${esc_.falta} linha(s) deste insumo</span>` : ""}</td>
      <td class="n">${esc_ ? brl(esc_.total) : ""}</td>
      <td class="n">${orcC ? brl(orcC) : ""}</td></tr>`;
  }).join("");
  const resumoForn = Object.entries(D.porForn).map(([fid, x]) => { const f = todos.find(z => z.id === fid);
    return `<tr><td>${esc(f?.nome || "")}<span class="emb">${x.insumos} insumo(s)${f?.condicaoPagamento ? ` · ${esc(f.condicaoPagamento)}` : ""}${f?.prazoEntrega ? ` · ${esc(f.prazoEntrega)}` : ""}</span></td>
      <td class="n">${brl(x.sub)}</td><td class="n">${x.ajuste ? (x.ajuste > 0 ? "+" : "−") + brl(Math.abs(x.ajuste)) : "—"}</td><td class="n"><b>${brl(x.total)}</b></td></tr>`; }).join("");
  const sav = R.orcCorr && D.definidos ? R.orcCorr - D.total : null;
  return `<section class="decisao">
    <div class="bar" style="margin-top:22px"><h2 style="margin:0">Decisão de compra</h2><div class="spacer"></div>
      <button class="btn sm" data-act="decMenor">Preencher com o menor preço</button>${D.definidos ? `<button class="btn sm" data-act="decLimpar">Limpar escolhas</button>` : ""}</div>
    <p class="lead">Clique no valor do fornecedor de quem vai comprar cada insumo; pode ser uma compra mista. O total soma os insumos escolhidos e aplica o frete, os descontos e os ajustes de cada fornecedor que entrar na compra.</p>
    <div class="scroller" id="scDec"><table class="qqp"><thead><tr><th class="c0">Insumo</th><th class="cq">Qtd</th><th class="cq">Un.</th>
      ${F.map(f => `<th class="forn bl">${esc(f.nome || "Sem nome")}</th>`).join("")}<th class="forn bl">Comprar de</th><th>Valor</th><th>Orç. corrigido</th></tr></thead>
      <tbody>${linhas}</tbody></table></div>
    <div class="dec-resumo">
      <table class="dec-forn"><thead><tr><th>Fornecedor na compra</th><th class="n">Subtotal</th><th class="n">Ajustes</th><th class="n">Total</th></tr></thead>
        <tbody>${resumoForn || `<tr><td colspan="4" style="color:var(--muted)">Nenhum insumo definido ainda.</td></tr>`}</tbody></table>
      <div class="dec-cards">
        <div class="dc"><span>Total da compra</span><b>${brl(D.total)}</b>${D.pendentes ? `<small style="color:var(--warn)">${D.pendentes} insumo(s) a definir</small>` : D.definidos ? `<small>todos os insumos definidos</small>` : ""}</div>
        <div class="dc"><span>Orçamento corrigido</span><b>${R.orcCorr ? brl(R.orcCorr) : "—"}</b>${R.fator !== 1 ? `<small>INCC ${fat(R.fator)}</small>` : ""}</div>
        <div class="dc ${sav === null ? "" : sav >= 0 ? "ok" : "ruim"}"><span>${sav === null ? "Saving" : sav >= 0 ? "Saving" : "Acima do orçamento"}</span><b>${sav === null ? "—" : brl(Math.abs(sav))}</b>${sav !== null && R.orcCorr ? `<small>${(Math.abs(sav) / R.orcCorr * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}% do orçamento</small>` : ""}</div>
      </div>
    </div></section>`;
}
function ranking(R, F){
  const lst = F.map(f => ({ f, ...R.final[f.id] })).sort((a, b) => (a.falta - b.falta) || (a.total - b.total));
  if (!lst.length) return "";
  const max = Math.max(R.orcCorr, R.decisao.total, ...lst.map(x => x.total), 1) * 1.04;
  const melhor = lst.find(x => x.falta === 0 && x.total > 0);
  const D = R.decisao;
  const linhaDec = D.definidos ? (() => { const sav = R.orcCorr ? R.orcCorr - D.total : null;
    return `<div class="rk decidida"><div class="nome">Compra definida<small style="color:var(--muted)">${esc(Object.keys(D.porForn).map(id => S.q.fornecedores.find(f => f.id === id)?.nome).join(" + "))}${D.pendentes ? ` · faltam ${D.pendentes} insumo(s)` : ""}</small></div>
      <div class="trilho"><div class="barra" style="width:${(Math.max(D.total, 0) / max * 100).toFixed(2)}%"></div>${R.orcCorr ? `<div class="marco" style="left:${(R.orcCorr / max * 100).toFixed(2)}%"></div>` : ""}</div>
      <div class="v">${brl(D.total)}</div><div class="s ${sav === null ? "" : sav >= 0 ? "pos" : "neg"}">${sav === null ? "" : (sav >= 0 ? "Saving " : "Acima ") + brl0(Math.abs(sav))}</div></div>`; })() : "";
  return `<section class="ranking" aria-label="Resumo por fornecedor">
    <div class="head"><h3>Proposta total por fornecedor</h3>
      <span class="orc" style="flex-basis:100%;order:3">${R.orcCorr ? `Orçamento corrigido ${brl(R.orcCorr)}${R.fator !== 1 ? ` (base ${brl(R.orc)} × INCC ${fat(R.fator)})` : ""}` : "Sem orçamento informado"}${R.inccFaltando ? ` <span style="color:var(--warn)">· mês de INCC sem índice na tabela</span>` : ""}</span></div>
    ${linhaDec}
    ${lst.map(x => { const sav = R.orcCorr ? R.orcCorr - x.total : null;
      return `<div class="rk ${melhor && x.f.id === melhor.f.id ? "melhor" : ""}">
        <div class="nome" title="${esc(x.f.nome)}">${esc(x.f.nome || "Sem nome")}${x.falta ? `<small style="color:var(--muted)">parcial: cotou ${R.nItens - x.falta} de ${R.nItens} ${R.nItens === 1 ? "item" : "itens"}</small>` : ""}${x.ajuste ? `<small style="color:var(--muted)">ajustes ${x.ajuste > 0 ? "+" : "−"}${brl(Math.abs(x.ajuste))}</small>` : ""}</div>
        <div class="trilho"><div class="barra" style="width:${(Math.max(x.total, 0) / max * 100).toFixed(2)}%"></div>
          ${R.orcCorr ? `<div class="marco" style="left:${(R.orcCorr / max * 100).toFixed(2)}%" title="Orçamento corrigido"></div>` : ""}</div>
        <div class="v">${brl(x.total)}</div>
        <div class="s ${x.falta || sav === null ? "" : sav >= 0 ? "pos" : "neg"}">${x.falta ? `<span style="color:var(--muted)">Proposta parcial</span>` : sav === null ? "" : (sav >= 0 ? "Saving " : "Acima ") + brl0(Math.abs(sav))}</div></div>`; }).join("")}
    <div class="legenda">${D.definidos ? `<span><i style="background:var(--green)"></i>Compra definida (pode ser mista)</span>` : ""}<span><i style="background:var(--primary)"></i>Menor proposta completa, com ajustes</span>${R.orcCorr ? `<span><i style="background:var(--ink);width:2px"></i>Orçamento corrigido</span>` : ""}<span><i style="background:var(--best)"></i>Menor preço na linha da tabela</span><span>Linha em cinza: escolhida automaticamente pelo menor preço</span></div>
  </section>`;
}
function fichaCurta(f){
  return [f.prazoEntrega && `Entrega: ${f.prazoEntrega}`, f.condicaoPagamento && `Pagamento: ${f.condicaoPagamento}`, f.frete && `Frete ${f.frete}`].filter(Boolean).map(esc).join("<br>");
}
function cabecalhoComp(q, F){
  const m = q.modelo, D = m.descritivas, C = m.campos;
  return `<thead><tr>
    <th class="c0" rowspan="2">${esc(m.usaNivel2 ? `${m.nivel2Nome} / ${rotuloInsumo(m).toLowerCase()}` : rotuloInsumo(m))}</th>
    ${D.map(d => `<th rowspan="2">${esc(d.nome)}</th>`).join("")}${ehGranito(m) ? `<th rowspan="2">Tipo</th>` : ""}
    ${C.map(c => `<th class="cq" rowspan="2">${esc(c.nome)}</th>`).join("")}<th class="cq" rowspan="2">Total</th><th class="cq" rowspan="2">Un.</th>
    ${F.map(f => `<th class="forn bl" colspan="3">${esc(f.nome || "Sem nome")}${fichaCurta(f) ? `<span class="ficha">${fichaCurta(f)}</span>` : ""}</th>`).join("")}
    <th class="forn bl" colspan="2">Orçamento</th></tr>
    <tr>${F.map(() => `<th class="bl">Linha</th><th>Preço unit.</th><th>Preço total</th>`).join("")}<th class="bl">Base</th><th>Corrigido</th></tr></thead>`;
}
function celTotais(tot, F){
  const mn = menorDe(tot, F);
  return F.map(f => { const t = tot[f.id];
    const best = mn !== null && t.falta === 0 && Math.abs(t.total - mn) < 0.005;
    return `<td class="bl"></td><td></td><td class="n ${best ? "best" : ""}" title="${t.falta ? `Não cotou ${t.falta} item(ns) deste grupo` : ""}">${brl(t.total)}${t.falta ? `<span class="emb">parcial</span>` : ""}</td>`;
  }).join("");
}
function selectEscolha(q, it, f, I, dataAttr){
  const ops = ofertasDe(q, it.insumoId, f.id);
  if (!ops.length) return "";
  const x = I.por[f.id]; const sel = x.o ? x.o.id : "__none";
  return `<select class="esc ${x.auto ? "auto" : ""}" ${dataAttr} data-f="${f.id}" aria-label="Linha de ${esc(f.nome)}">
    ${ops.map(o => `<option value="${o.id}" ${o.id === sel ? "selected" : ""}>${esc(o.linha || "(sem nome)")}</option>`).join("")}
    <option value="__none" ${sel === "__none" ? "selected" : ""}>Não considerar</option></select>`;
}
function embTexto(o, un, global){
  if (global) return "valor global";
  const c = num(o.contem) || 1;
  if (!o.unidVenda && c === 1) return "";
  return `${brl(num(o.preco))} / ${o.unidVenda || "unid."}${c !== 1 ? ` (${qtdF(c)} ${un})` : ""}`;
}
function corpoComp(q, R, F){
  const m = q.modelo, C = m.campos, GR = ehGranito(m) ? 1 : 0;
  const D = m.descritivas, DG = D.length + GR;
  const vazias = n => "<td></td>".repeat(n);
  const fixasDepois = DG + C.length + 2;
  let h = "";
  const linhaTotal = (rot, tot, cls, orc, orcC) => `<tr class="${cls}"><td class="c0">${rot}</td>${vazias(fixasDepois)}${celTotais(tot, F)}<td class="n bl">${orc ? brl(orc) : ""}</td><td class="n">${orcC ? brl(orcC) : ""}</td></tr>`;
  h += linhaTotal("Total dos itens", R.total, "l0", R.orc, R.orcCorr);
  if (F.some(f => R.final[f.id].ajuste)){
    h += `<tr class="l0b"><td class="c0">Ajustes (frete, descontos e outros)</td>${vazias(fixasDepois)}${F.map(f => { const a = R.final[f.id].ajuste; return `<td class="bl"></td><td></td><td class="n">${a ? (a > 0 ? "+" : "−") + brl(Math.abs(a)) : "—"}</td>`; }).join("")}<td class="bl"></td><td></td></tr>`;
    const finais = Object.fromEntries(F.map(f => [f.id, { total: R.final[f.id].total, falta: R.final[f.id].falta }]));
    h += linhaTotal("Total com ajustes", finais, "l0", 0, 0);
  }
  for (const g of q.grupos){
    const G = R.grupos[g.id], fg = S.fechados.has(g.id);
    h += `<tr class="l1"><td class="c0"><button class="caret" data-act="toggle" data-id="${g.id}" aria-label="${fg ? "Expandir" : "Recolher"}">${fg ? "▶" : "▼"}</button> ${esc(g.nome || "Agrupador")}</td>
      ${vazias(DG + C.length)}<td class="n cq">${G.qtd ? qtdF(G.qtd) : ""}</td><td></td>${celTotais(G.total, F)}
      <td class="n bl">${G.orc ? brl(G.orc) : ""}</td><td class="n">${G.orc ? brl(G.orc * R.fator) : ""}</td></tr>`;
    if (fg) continue;
    for (const p of g.n2){
      const P = R.n2[p.id], fp = S.fechados.has(p.id);
      if (m.usaNivel2){
        h += `<tr class="l2"><td class="c0"><button class="caret" data-act="toggle" data-id="${p.id}" aria-label="${fp ? "Expandir" : "Recolher"}">${fp ? "▶" : "▼"}</button> ${esc(p.nome || m.nivel2Nome)}</td>
          ${vazias(DG)}${C.map(c => `<td class="n cq">${c.nivel === "n2" ? qtdF(num(p.valores[c.chave])) : ""}</td>`).join("")}
          <td class="n cq">${P.qtd ? qtdF(P.qtd) : ""}</td><td></td>${celTotais(P.total, F)}<td class="n bl">${P.orc ? brl(P.orc) : ""}</td><td class="n">${P.orc ? brl(P.orc * R.fator) : ""}</td></tr>`;
        if (fp) continue;
      }
      for (const it of p.itens){
        const I = R.itens[it.id], ins = insumoDe(q, it.insumoId), un = unidadeInsumo(q, ins);
        h += `<tr class="l3"><td class="c0" ${m.usaNivel2 ? "" : `style="padding-left:22px"`}>${esc(ins?.nome || "—")}${I.embalagensDiferentes ? `<span class="aviso" title="Fornecedores cotaram em embalagens diferentes. Os preços foram convertidos para ${esc(un)}; confira o conteúdo de cada embalagem.">⚠</span>` : ""}</td>
          ${D.map(d => { const ck = d.chave === "batente" ? checarBatente(m, it) : null;
            return `<td class="desc-col" title="${esc(it.desc[d.id])}">${esc(it.desc[d.id])}${ck && ck.ok === false ? `<span class="aviso" title="${esc(textoBatente(ck))}">⚠</span>` : ""}</td>`; }).join("")}
          ${GR ? `<td class="desc-col" title="${esc(I.partes?.tipo || "")}">${I.partes?.semTipo ? `<span style="color:var(--warn)">sem tipo</span>` : esc(I.partes?.tipo || "")}</td>` : ""}
          ${it.global ? `${C.map(() => `<td></td>`).join("")}<td class="vg" colspan="2">valor global</td>`
            : `${C.map(c => `<td class="n cq">${qtdF(num(I.vars[c.chave]))}</td>`).join("")}<td class="n cq" ${I.nPers ? `title="${esc(it.pers.map(x => `${x.onde || "?"}: ${num(x.qtd) > 0 ? "+" : ""}${qtdF(num(x.qtd))}${x.motivo ? " (" + x.motivo + ")" : ""}`).join("\n"))}"` : ""}><b>${qtdF(I.qtd)}</b>${I.nPers ? `<span class="emb">padrão ${qtdF(I.base)}, pers. ${I.persSoma > 0 ? "+" : I.persSoma < 0 ? "−" : ""}${qtdF(Math.abs(I.persSoma))}</span>` : ""}</td><td class="un">${esc(un)}</td>`}
          ${F.map(f => { const x = I.por[f.id];
            const sel = selectEscolha(q, it, f, I, `data-esc="${it.id}"`);
            if (!x.o) return `<td class="bl">${sel}</td><td class="sem" colspan="2">${x.none ? "não considerado" : x.n === 0 ? "não cotado" : "—"}</td>`;
            const best = I.min !== null && Math.abs(x.total - I.min) < 0.005;
            const emb = embTexto(x.o, un, it.global);
            const nEmb = !it.global && num(x.o.contem) > 1 ? Math.ceil(I.qtd / num(x.o.contem) - 1e-9) : null;
            return `<td class="bl"><div class="esc-wrap">${sel}${x.o.imagemId ? `<button class="thumb-btn mini" data-act="verImg" data-id="${x.o.id}" title="Ampliar imagem">${thumb(x.o.imagemId)}</button>` : ""}</div></td>
              <td class="n" title="${nEmb ? `Para o pedido: ${qtdF(nEmb)} ${esc(x.o.unidVenda || "unid.")}` : ""}">${brl(x.unit)}${emb ? `<span class="emb">${esc(emb)}</span>` : ""}</td>
              <td class="n ${best ? "best" : ""}">${brl(x.total)}</td>`;
          }).join("")}
          <td class="n bl">${I.orc ? brl(I.orc) : ""}</td><td class="n">${I.orc ? brl(I.orc * R.fator) : ""}</td></tr>`;
      }
    }
  }
  // resumo por insumo (escolha aplicada a todas as linhas do insumo)
  if (R.insumos.size){
    h += `<tr class="sec"><td class="c0">Resumo por insumo</td><td colspan="${fixasDepois + F.length * 3 + 2}">Escolher a linha aqui aplica a mesma escolha em todas as linhas do insumo.</td></tr>`;
    for (const ins of R.insumos.values()){
      if (!ins.id) continue;
      h += `<tr class="l3"><td class="c0" style="padding-left:12px">${esc(ins.nome)}</td>${vazias(DG + C.length)}${ins.itens.every(i => i.global) ? `<td class="vg" colspan="2">valor global</td>` : `<td class="n cq"><b>${qtdF(ins.qtd)}</b></td><td class="un">${esc(ins.un)}</td>`}
        ${F.map(f => { const ops = ofertasDe(q, ins.id, f.id); const t = ins.total[f.id];
          const es = ins.escolhidas[f.id]; const unica = es && es.size === 1 ? [...es][0] : null;
          const explic = new Set(ins.itens.map(i => i.escolhas?.[f.id] || ""));
          const sel = ops.length ? `<select class="esc" data-escins="${ins.id}" data-f="${f.id}" aria-label="Linha de ${esc(f.nome)} para ${esc(ins.nome)}">
              <option value="" ${explic.size === 1 && explic.has("") ? "selected" : ""}>Menor preço (automático)</option>
              ${ops.map(o => `<option value="${o.id}" ${explic.size === 1 && explic.has(o.id) ? "selected" : ""}>${esc(o.linha || "(sem nome)")}</option>`).join("")}
              <option value="__none" ${explic.size === 1 && explic.has("__none") ? "selected" : ""}>Não considerar</option>
              ${explic.size > 1 ? `<option selected disabled>(varia por linha)</option>` : ""}</select>` : "";
          const o = unica ? q.ofertas.find(x => x.id === unica) : null;
          const nEmb = o && num(o.contem) > 1 ? Math.ceil(ins.qtd / num(o.contem) - 1e-9) : null;
          return `<td class="bl"><div class="esc-wrap">${sel}${o?.imagemId ? `<button class="thumb-btn mini" data-act="verImg" data-id="${o.id}" title="Ampliar imagem">${thumb(o.imagemId)}</button>` : ""}</div></td><td class="n">${o ? brl(precoUn(o)) : ""}${nEmb ? `<span class="emb">${qtdF(nEmb)} ${esc(o.unidVenda || "unid.")} p/ pedido</span>` : ""}</td><td class="n">${brl(t.total)}${t.falta ? `<span class="emb">parcial</span>` : ""}</td>`;
        }).join("")}<td class="bl"></td><td></td></tr>`;
    }
  }
  return h;
}

/* ----- quantitativos ----- */
function textoBatente(c){
  if (!c) return "";
  const faixa = c.lo === c.hi ? `${qtdF(c.lo)} cm` : `${qtdF(c.lo)} a ${qtdF(c.hi)} cm`;
  if (c.ok === false) return `A parede (${faixa}) não cabe no batente ${c.atual.txt} (${qtdF(c.atual.min)} a ${qtdF(c.atual.max)} cm).` + (c.sugestao ? ` Sugerido: ${c.sugestao.txt}.` : " Nenhum batente cadastrado cobre essa faixa.");
  if (c.ok === null && c.sugestao) return `Sugerido para parede de ${faixa}: ${c.sugestao.txt}.`;
  if (c.ok === null && c.lo != null && !c.sugestao) return `Nenhum batente cadastrado cobre parede de ${faixa}.`;
  return "";
}
function htmlBatente(c, id){
  if (!c || c.lo == null) return "";
  if (c.ok === false) return c.sugestao ? `<button class="bat-btn alerta" data-act="usarBatente" data-id="${id}" title="${esc(textoBatente(c))} Clique para usar o sugerido.">⚠ ${esc(c.sugestao.txt)}</button>` : `<span class="aviso" title="${esc(textoBatente(c))}">⚠</span>`;
  if (c.ok === null) return c.sugestao ? `<button class="bat-btn" data-act="usarBatente" data-id="${id}" title="${esc(textoBatente(c))}">usar ${esc(c.sugestao.txt)}</button>` : `<span class="aviso" title="${esc(textoBatente(c))}">⚠</span>`;
  return `<span class="bat-ok" title="Batente cobre a parede">✓</span>`;
}
function botaoPers(I, id){
  if (!I) return "";
  const n = I.nPers, sm = I.persSoma;
  return `<button class="btn sm" data-act="pers" data-id="${id}" title="Personalizações de apartamentos" style="${n ? "border-color:var(--warn);color:var(--warn)" : "color:var(--muted)"}">${n ? `${sm > 0 ? "+" : sm < 0 ? "−" : ""}${qtdF(Math.abs(sm))} (${n})` : "+"}</button>`;

function celQtdItem(I){

}

          <td><div class="grp-flex"><select class="in" style="min-width:0;width:auto" data-bind="${base}.orcModo" aria-label="Tipo de orçamento">
              <option value="total" ${it.orcModo !== "unit" ? "selected" : ""}>R$ total</option><option value="unit" ${it.orcModo === "unit" ? "selected" : ""}>R$ / ${esc(unidadeInsumo(q, ins))}</option></select>
            <input class="in din" data-bind="${base}.orcValor" data-tipo="num" inputmode="decimal" value="${esc(inVal(it.orcValor))}" placeholder="orçamento" aria-label="Orçamento do insumo"></div></td>
          <td class="acoes"><label title="Cotado por valor global (fornecedor informa o total)" style="font-size:12px;color:var(--muted);margin-right:4px;cursor:pointer"><input type="checkbox" data-global="${gi}.${pi}.${ii}" ${it.global ? "checked" : ""}> VG</label><button class="icon" data-act="mov" data-nivel="i" data-g="${gi}" data-p="${pi}" data-i="${ii}" data-d="-1" title="Subir" aria-label="Subir">▲</button><button class="icon" data-act="mov" data-nivel="i" data-g="${gi}" data-p="${pi}" data-i="${ii}" data-d="1" title="Descer" aria-label="Descer">▼</button><button class="icon del" data-act="del" data-nivel="i" data-g="${gi}" data-p="${pi}" data-i="${ii}" title="Excluir insumo" aria-label="Excluir insumo">✕</button></td></tr>`;
      });
      h += `<tr class="addrow"><td class="c0" style="padding-left:${m.usaNivel2 ? 42 : 22}px"><button class="btn sm" data-act="addItem" data-g="${gi}" data-p="${pi}">+ Insumo</button></td><td colspan="${nCols}"></td></tr>`;
    });
    if (m.usaNivel2) h += `<tr class="addrow"><td class="c0" style="padding-left:22px"><button class="btn sm" data-act="addN2" data-g="${gi}">+ ${esc(m.nivel2Nome)}</button></td><td colspan="${nCols}"></td></tr>`;
  });
  return `<div class="bar"><div><h2>Quantitativos</h2></div><div class="spacer"></div>
      ${m.usaNivel2 ? `<button class="btn sm" data-act="expandir">Expandir tudo</button><button class="btn sm" data-act="recolher">Recolher ${esc(m.nivel2Nome.toLowerCase())}</button>` : ""}
      <button class="btn primary" data-act="addGrupo">+ Agrupador</button></div>
    <p class="lead">Total = ${esc(formulaLegivel(m))}. ${Cn2.length ? `Colunas do ${esc(m.nivel2Nome.toLowerCase())} valem para todos os insumos dele.` : ""} O insumo é o mesmo em todas as linhas com o mesmo nome; as linhas cotadas ficam em Fornecedores e preços.</p>
    <datalist id="dlInsumos">${q.insumos.map(i => `<option value="${esc(i.nome)}">`).join("")}</datalist>
    ${q.grupos.length ? `<div class="scroller" id="scQuant"><table class="qqp"><thead><tr>
        <th class="c0">${esc(m.usaNivel2 ? `Agrupador / ${m.nivel2Nome.toLowerCase()} / ${rotuloInsumo(m).toLowerCase()}` : `Agrupador / ${rotuloInsumo(m).toLowerCase()}`)}</th>
        ${D.map(d => `<th>${esc(d.nome)}</th>`).join("")}${GR ? `<th>Tipo de bancada</th>` : ""}
        ${C.map(c => `<th class="cq">${esc(c.nome)}${c.unidade ? ` (${esc(c.unidade)})` : ""}</th>`).join("")}
        <th class="cq">Total</th><th class="cq" title="Personalizações de apartamentos (+ ou −)">Personal.</th><th class="cq">Un.</th><th>Orçamento</th><th class="acoes"></th></tr></thead>
      <tbody>${h}</tbody></table></div>` :
      `<div class="vazio"><h3>Comece pelo agrupador</h3><p>O agrupador é o primeiro nível (Torre, Smart, Garden).${m.usaNivel2 ? ` Dentro dele entram ${esc(m.nivel2Nome.toLowerCase())} e, dentro de cada um, os insumos.` : " Dentro dele entram os insumos."}</p><button class="btn primary" data-act="addGrupo">+ Agrupador</button></div>`}`;
}

/* ----- fornecedores e preços ----- */
function abaFornecedores(){
  const q = S.q, F = q.fornecedores, FV = fornVisiveis(q), R = calc(q);
  const boxes = F.map((f, fi) => S.ocultos.has(f.id) ? "" : `
    <div class="forn-box">
      <div class="cab"><input data-bind="fornecedores.${fi}.nome" value="${esc(f.nome)}" placeholder="Nome do fornecedor" aria-label="Nome do fornecedor">
        <button class="icon" data-act="movF" data-f="${fi}" data-d="-1" title="Mover coluna para a esquerda" aria-label="Mover para a esquerda">◀</button>
        <button class="icon" data-act="movF" data-f="${fi}" data-d="1" title="Mover coluna para a direita" aria-label="Mover para a direita">▶</button>
        <button class="icon del" data-act="delF" data-f="${fi}" title="Excluir fornecedor" aria-label="Excluir fornecedor">✕</button></div>
      <div class="grid2">
        <div class="mini full"><label>CNPJ</label><input data-bind="fornecedores.${fi}.cnpj" value="${esc(f.cnpj)}" placeholder="00.000.000/0000-00"></div>
        <div class="mini"><label>Prazo de entrega</label><input data-bind="fornecedores.${fi}.prazoEntrega" value="${esc(f.prazoEntrega)}" placeholder="Ex.: 15 dias após pedido"></div>
        <div class="mini"><label>Condição de pagamento</label><input data-bind="fornecedores.${fi}.condicaoPagamento" value="${esc(f.condicaoPagamento)}" placeholder="Ex.: 30% + 3x"></div>
        <div class="mini"><label>Entrada (% no pedido)</label><input data-bind="fornecedores.${fi}.entradaPct" data-tipo="num" inputmode="decimal" value="${esc(inVal(f.entradaPct))}" placeholder="Ex.: 30"></div>
        <div class="mini"><label>Parcelas (dias)</label><input data-bind="fornecedores.${fi}.parcelas" value="${esc(f.parcelas)}" placeholder="Ex.: 30 60 90"></div>
        <div class="mini"><label>Parcelas contadas do</label><select data-bind="fornecedores.${fi}.parcelasBase"><option value="">—</option>${["pedido", "entrega"].map(x => `<option ${f.parcelasBase === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
        <div class="mini"><label>Frete</label><select data-bind="fornecedores.${fi}.frete"><option value="">—</option>${["CIF", "FOB"].map(x => `<option ${f.frete === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
        <div class="mini"><label>Validade da proposta</label><input type="date" data-bind="fornecedores.${fi}.validade" value="${esc(f.validade)}"></div>
        <div class="mini"><label>Contato</label><input data-bind="fornecedores.${fi}.contato" value="${esc(f.contato)}" placeholder="Nome do vendedor"></div>
        <div class="mini"><label>Telefone</label><input data-bind="fornecedores.${fi}.telefone" value="${esc(f.telefone)}"></div>
        <div class="mini full"><label>E-mail</label><input type="email" data-bind="fornecedores.${fi}.email" value="${esc(f.email)}"></div>
        <div class="mini full"><label>Observações</label><input data-bind="fornecedores.${fi}.obs" value="${esc(f.obs)}" placeholder="O que está ou não incluso, impostos, etc."></div>
      </div>
      <h4>Ajustes no total da proposta</h4>
      <div class="grid2">
        <div class="mini"><label>Frete (R$)</label><input data-bind="fornecedores.${fi}.ajustes.frete" data-tipo="num" inputmode="decimal" value="${esc(inVal(f.ajustes.frete))}" placeholder="0,00"></div>
        <div class="mini"><label>Desconto (%)</label><input data-bind="fornecedores.${fi}.ajustes.descontoPct" data-tipo="num" inputmode="decimal" value="${esc(inVal(f.ajustes.descontoPct))}" placeholder="0"></div>
        <div class="mini"><label>Desconto (R$)</label><input data-bind="fornecedores.${fi}.ajustes.descontoValor" data-tipo="num" inputmode="decimal" value="${esc(inVal(f.ajustes.descontoValor))}" placeholder="0,00"></div>
      </div>
      ${f.ajustes.outros.map((x, xi) => `<div class="grid2" style="grid-template-columns:1fr 120px 30px;margin-bottom:4px">
        <div class="mini"><input data-bind="fornecedores.${fi}.ajustes.outros.${xi}.desc" value="${esc(x.desc)}" placeholder="Descrição (ex.: instalação)" aria-label="Descrição do ajuste"></div>
        <div class="mini"><input data-bind="fornecedores.${fi}.ajustes.outros.${xi}.valor" data-tipo="num" inputmode="decimal" value="${esc(inVal(x.valor))}" placeholder="+ ou − R$" aria-label="Valor do ajuste"></div>
        <button class="icon del" data-act="delAj" data-f="${fi}" data-i="${xi}" aria-label="Excluir ajuste">✕</button></div>`).join("")}
      <div class="rodape"><button class="btn sm" data-act="addAj" data-f="${fi}">+ Outro ajuste</button></div>
      <div class="ajuste-total">Itens ${brl(R.final[f.id].base)} · ajustes ${R.final[f.id].ajuste >= 0 ? "+" : "−"}${brl(Math.abs(R.final[f.id].ajuste))} · <b>total ${brl(R.final[f.id].total)}</b></div>
    </div>`).join("");

  const usados = new Set(todosItens(q).map(i => i.insumoId));
  const blocos = q.insumos.map((ins, ki) => {
    const un = unidadeInsumo(q, ins);
    const linhas = [];
    FV.forEach(f => q.ofertas.forEach((o, oi) => { if (o.insumoId === ins.id && o.fornId === f.id) linhas.push({ o, oi, f }); }));
    const qtd = R.insumos.get(ins.id)?.qtd || 0;
    let ultimoF = null;
    return `<div class="insumo-bloco">
      <div class="cab"><input class="nome" data-bind="insumos.${ki}.nome" value="${esc(ins.nome)}" aria-label="Nome do insumo">
        <span class="info">Cód. Sienge <input class="un" style="width:80px" data-bind="insumos.${ki}.codigo" value="${esc(ins.codigo || "")}" aria-label="Código Sienge"></span>
        <span class="info">Unidade <input class="un" data-bind="insumos.${ki}.unidade" value="${esc(ins.unidade || "")}" placeholder="${esc(q.modelo.unidade || "un")}" aria-label="Unidade do insumo"></span>
        <span class="info">Qtd total <b>${qtdF(qtd)} ${esc(un)}</b></span>
        ${usados.has(ins.id) ? "" : `<span class="info" style="color:var(--warn)">sem uso nos quantitativos</span><button class="icon del" data-act="delIns" data-k="${ki}" aria-label="Excluir insumo">✕</button>`}</div>
      ${linhas.length ? `<table class="ofertas"><thead><tr><th style="width:150px">Fornecedor</th><th>Linha / produto</th><th class="r" style="width:120px">Preço cotado (R$)</th><th style="width:150px">Unidade de venda</th><th class="r" style="width:110px">Contém (${esc(un)})</th><th class="r" style="width:130px">Preço por ${esc(un)}</th><th style="width:76px">Imagem</th><th style="width:34px"></th></tr></thead><tbody>
        ${linhas.map(({ o, oi, f }) => { const novoF = f.id !== ultimoF; ultimoF = f.id;
          return `<tr class="${novoF ? "sep" : ""}"><td class="forn-nome">${novoF ? esc(f.nome || "Sem nome") : ""}</td>
            <td><input data-bind="ofertas.${oi}.linha" value="${esc(o.linha)}" placeholder="Ex.: ROCA - VASO ZIP PLUS" aria-label="Linha"></td>
            <td><input class="r" data-bind="ofertas.${oi}.preco" data-tipo="num" inputmode="decimal" value="${esc(inVal(o.preco))}" placeholder="0,00" aria-label="Preço cotado"></td>
            <td><input list="dlEmb" data-bind="ofertas.${oi}.unidVenda" data-emb="${oi}" value="${esc(o.unidVenda)}" placeholder="${esc(un)}" aria-label="Unidade de venda"></td>
            <td><input class="r" data-bind="ofertas.${oi}.contem" data-tipo="num" inputmode="decimal" value="${esc(inVal(o.contem))}" placeholder="1" aria-label="Conteúdo da unidade de venda"></td>
            <td class="calc" data-pu="${oi}">${brl(precoUn(o))}${num(o.contem) > 1 ? `<small>${qtdF(Math.ceil(qtd / num(o.contem) - 1e-9))} ${esc(o.unidVenda || "unid.")} p/ pedido</small>` : ""}</td>
            <td>${o.imagemId ? `<button class="thumb-btn" data-act="imgOferta" data-o="${oi}" title="Ver ou trocar a imagem">${thumb(o.imagemId)}</button>`
              : o.imagemArquivada ? `<button class="bat-btn" data-act="imgOferta" data-o="${oi}" title="A imagem foi apagada do banco e está no relatório final">arquivada</button>`
              : `<button class="bat-btn" data-act="imgOferta" data-o="${oi}" title="Colar print do catálogo">+ imagem</button>`}</td>
            <td><button class="icon del" data-act="delOf" data-o="${oi}" aria-label="Excluir linha cotada">✕</button></td></tr>`; }).join("")}
      </tbody></table>` : ""}
      <div class="rodape">${FV.length ? `<select id="addOfF${ki}" aria-label="Fornecedor da nova linha">${FV.map(f => `<option value="${f.id}">${esc(f.nome || "Sem nome")}</option>`).join("")}</select>
        <button class="btn sm" data-act="addOf" data-k="${ki}">+ Linha cotada</button>` : `<span style="color:var(--muted);font-size:14px">Cadastre um fornecedor para lançar preços.</span>`}</div>
    </div>`;
  }).join("");

  return `<div class="wrap" style="max-width:1400px">
    <div class="bar"><div><h2>Fornecedores e preços</h2></div><div class="spacer"></div>${filtroFornecedores()}<button class="btn primary" data-act="addF">+ Fornecedor</button></div>
    <p class="lead">A ordem dos fornecedores aqui é a ordem das colunas no comparativo. Prazo e pagamento aparecem no cabeçalho de cada fornecedor no comparativo.</p>
    ${F.length ? `<div class="forns">${boxes}</div>` : `<div class="vazio" style="margin-bottom:24px"><h3>Nenhum fornecedor ainda</h3><p>Adicione os fornecedores participantes da concorrência.</p><button class="btn primary" data-act="addF">+ Fornecedor</button></div>`}
    <div class="bar"><h2 style="margin:0">Preços por insumo</h2><div class="spacer"></div><button class="btn" data-act="colarOfertas">Colar do Excel</button></div>
    <p class="lead">Cada fornecedor pode ter várias linhas para o mesmo insumo; a escolha é feita no comparativo. Informe o preço como está na proposta e quanto a unidade de venda contém (ex.: saco 28 kg contém 28), que o sistema converte para a unidade do insumo.</p>
    <datalist id="dlEmb">${S.embalagens.map(e => `<option value="${esc(e.nome)}">${esc(e.nome)} (contém ${qtdF(e.contem)})</option>`).join("")}</datalist>
    ${q.insumos.length ? blocos : `<div class="vazio"><h3>Nenhum insumo ainda</h3><p>Os insumos são criados ao preencher a coluna de insumo em Quantitativos.</p><button class="btn" data-act="tab" data-tab="quant">Ir para Quantitativos</button></div>`}
  </div>`;
}

/* ----- dados da QQP ----- */
function abaDados(){
  const q = S.q, m = q.modelo, R = calc(q), i = q.incc;
  const meses = S.incc.map(x => x.mes);
  const sel = (campoMes, campoMan, rot) => `<div class="field"><label>${rot}</label>
    <select data-bind="incc.${campoMes}">${`<option value="">Informar manualmente</option>`}${meses.map(mm => `<option value="${mm}" ${i[campoMes] === mm ? "selected" : ""}>${mesBR(mm)} (${inVal(inccValor(mm))})</option>`).join("")}</select>
    ${i[campoMes] ? "" : `<input style="margin-top:6px" data-bind="incc.${campoMan}" data-tipo="num" inputmode="decimal" value="${esc(inVal(i[campoMan]))}" placeholder="Índice">`}</div>`;
  return `<div class="wrap" style="max-width:900px">
    <h2>Dados da QQP</h2><p class="lead">Identificação, correção do orçamento e o modelo de quantitativos usado.</p>
    <div class="form-grid">
      <div class="field"><label for="dPac">Carteira de insumo</label><input id="dPac" data-bind="pacote" value="${esc(q.pacote)}"></div>
      <div class="field"><label for="dRev">Revisão</label><input id="dRev" data-bind="revisao" value="${esc(q.revisao)}" placeholder="R00"></div>
      <div class="field"><label for="dData">Data das propostas</label><input id="dData" type="date" data-bind="data" value="${esc(q.data)}"></div>
    </div>
    <h3 style="margin-bottom:8px">Para o mapa de cotação</h3>
    <div class="form-grid">
      <div class="field"><label for="dCod">Código da compra programada</label><input id="dCod" data-bind="codigoCompra" value="${esc(q.codigoCompra)}" placeholder="Ex.: 3.6.1"></div>
      <div class="field"><label for="dComp">Comprador</label><input id="dComp" data-bind="comprador" value="${esc(q.comprador)}"></div>
      <div class="field"><label for="dAte">Comprar até</label><input id="dAte" type="date" data-bind="comprarAte" value="${esc(q.comprarAte)}"></div>
      <div class="field"><label for="dCock">ID cockpit</label><input id="dCock" data-bind="idCockpit" value="${esc(q.idCockpit)}"></div>
    </div>
    <h3 style="margin-bottom:8px">Correção do orçamento pelo INCC</h3>
